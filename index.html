rony (ekscytotoksyczność).": "Головний збуджувальний медіатор; ключовий для LTP; у надлишку шкодить нейронам (ексайтотоксичність).", "Główny przekaźnik hamujący w mózgu; jego działanie nasilają benzodiazepiny i alkohol.": "Головний гальмівний медіатор у мозку; його дію посилюють бензодіазепіни й алкоголь.", "Nagroda, motywacja i ruch; nadmiar w drodze mezolimbicznej łączy się z objawami pozytywnymi schizofrenii.": "Винагорода, мотивація і рух; надлишок у мезолімбічному шляху пов'язаний із позитивними симптомами шизофренії.", "Nastrój, sen, apetyt, impulsywność; cel leków SSRI.": "Настрій, сон, апетит, імпульсивність; мішень ліків СІЗЗС.", "Złącze nerwowo-mięśniowe, uwaga i pamięć; w chorobie Alzheimera giną neurony, które go wytwarzają.": "Нервово-м'язовий синапс, увага й пам'ять; при хворобі Альцгеймера гинуть нейрони, які його виробляють.", "Czujność i pobudzenie; główne źródło to miejsce sinawe.": "Пильність і збудження; головне джерело — блакитна пляма.", "Blokuje wychwyt zwrotny serotoniny; lek przeciwdepresyjny.": "Блокує зворотне захоплення серотоніну; антидепресант.", "Wzmacnia działanie GABA na receptor GABA-A; działa przeciwlękowo i nasennie.": "Посилює дію ГАМК на рецептор ГАМК-А; діє протитривожно і снодійно.", "Blokuje receptory dopaminowe D2; klasyczny lek przeciwpsychotyczny.": "Блокує дофамінові рецептори D2; класичний антипсихотик.", "Antagonista receptorów opioidowych; odwraca przedawkowanie opioidów.": "Антагоніст опіоїдних рецепторів; скасовує передозування опіоїдів.", "Stabilizator nastroju w chorobie dwubiegunowej; jego mechanizm nie jest w pełni poznany.": "Стабілізатор настрою при біполярному розладі; його механізм вивчено не повністю.", "Końcowy hormon; hamuje zwrotnie podwzgórze i przysadkę": "Кінцевий гормон; гальмує у зворотному зв'язку гіпоталамус і гіпофіз", "Wydzielana przez szyszynkę w ciemności; sygnalizuje noc.": "Виділяється епіфізом у темряві; сигналізує ніч.", "Związany z dominacją i agresją; maskulinizuje mózg w okresie płodowym.": "Пов'язаний з домінантністю й агресією; маскулінізує мозок у плодовому періоді.", "Zatrzymuje wodę w nerkach; u samców nornic preriowych wiąże się z monogamią.": "Затримує воду в нирках; у самців степових полівок пов'язаний з моногамією.", "Hormon antydiuretyczny: sprawia, że nerki zatrzymują wodę. Nornice preriowe to gryzonie żyjące w stałych parach; u ich samców wazopresyna wiąże się z przywiązaniem do partnerki.": "Антидіуретичний гормон: змушує нирки затримувати воду. Степові полівки — гризуни, що живуть сталими парами; у їхніх самців вазопресин пов'язаний із прив'язаністю до партнерки.", "Hormon tarczycy; niedobór w rozwoju prowadzi do niepełnosprawności intelektualnej.": "Гормон щитоподібної залози; нестача під час розвитку призводить до інтелектуальної недостатності.", "Wydzielana przez żołądek przed posiłkiem; nasila głód.": "Виділяється шлунком перед їжею; посилює голод.", "Wydzielana przez tkankę tłuszczową; informuje podwzgórze o zapasach energii.": "Виділяється жировою тканиною; інформує гіпоталамус про запаси енергії.", "Obniża poziom glukozy we krwi; żaden opis tu do niej nie pasuje.": "Знижує рівень глюкози в крові; жоден опис тут до нього не пасує.", "Pamięć deklaratywna to fakty i zdarzenia, które da się opowiedzieć. Hipokamp je utrwala (konsolidacja); bez hipokampów H.M. nie zapamiętywał nic nowego.": "Декларативна пам'ять — це факти й події, які можна розповісти. Гіпокамп їх закріплює (консолідація); без гіпокампів H.M. не запам'ятовував нічого нового.", "Na początku ciąży płaska płytka komórek zwija się w rurkę, czyli cewę nerwową; powstanie z niej mózg i rdzeń. Gdy się nie zamknie, powstaje rozszczep kręgosłupa. Chroni przed tym kwas foliowy.": "На початку вагітності пласка пластинка клітин згортається в трубку, тобто нервову трубку; з неї утвориться головний і спинний мозок. Якщо вона не замкнеться, виникає розщеплення хребта. Від цього захищає фолієва кислота.", "Losowe zmiany częstości alleli w małych populacjach; nie pasuje do żadnego opisu.": "Випадкові зміни частоти алелів у малих популяціях; не пасує до жодного опису.", "W REM (od ang. rapid eye movement) EEG wygląda jak przy czuwaniu, oczy szybko się poruszają, a mięśnie są zwiotczałe (atonia), żeby nie odgrywać snów. Wtedy śnimy najżywiej; to tzw. sen paradoksalny.": "У REM (від англ. rapid eye movement — швидкі рухи очей) ЕЕГ схожа на неспання, очі швидко рухаються, а м'язи розслаблені (атонія), щоб ми не відтворювали сни рухами. Тоді сни найяскравіші; це так званий парадоксальний сон.", "Uogólnione wyładowania iglica–fala 3 Hz; kilkusekundowe „wyłączenia” u dziecka": "Генералізовані розряди пік–хвиля 3 Гц; кількасекундні «вимкнення» в дитини", "Promienie rentgenowskie; szybka diagnoza krwotoku.": "Рентгенівське проміння; швидка діагностика крововиливу.", "odskakujesz": "відскакуєш", "uspokojenie": "заспокоєння", "rozszerzone": "розширені", "perystaltyka": "перистальтика", "zahamowane": "загальмовані", "sucho w ustach": "сухо в роті", "glukoza do krwi": "глюкоза в кров", "magazynuje": "запасає", "oddech": "дихання", "„{0}”: {1}": "«{0}»: {1}", "Kora": "Кора", ". Modele są uproszczone do nauki. Postęp zapisuje się tylko w tej przeglądarce.": ". Моделі спрощені для навчання. Прогрес зберігається лише в цьому браузері.", "schemat": "схема", "symulacja": "симуляція", "sortowanie": "сортування", "animacja": "анімація", "eksperyment": "експеримент", "wykres": "графік", "Mózg w widoku bocznym; dotknij obszaru": "Мозок збоку; торкнися ділянки", "szczelina": "щілина", "kortyzol": "кортизол", "presynaptyczny": "пресинаптичний", "Mózg i zachowanie do klikania. Każdy poziom ma dwa etapy:": "Мозок і поведінка, в яких можна клацати. Кожен рівень має два етапи:", "(złóż to sam).": "(склади сам).", "{0} mV": "{0} мВ", "β 13–30 Hz": "β 13–30 Гц", "α 8–13 Hz": "α 8–13 Гц", "θ 4–8 Hz": "θ 4–8 Гц", "δ 0,5–4 Hz": "δ 0,5–4 Гц", "4 s": "4 с", "1 ms": "1 мс", "1 s": "1 с", "1 h": "1 год", "1 mm": "1 мм", "1 cm": "1 см", "10 cm": "10 см", "CT": "КТ", "DTI": "DTI"};const MISS=new Set();
function tr(s,...a){
  if(typeof s!=="string")return s;let r=s;
  if(LANG==="uk"&&s.trim()){
    const t=s.trim();
    if(UA[s]!=null)r=UA[s];
    else if(UA[t]!=null)r=s.replace(t,UA[t]);
    else{const m=s.match(/^([\s✓✕⏱⚠⚡📈🧱·→←↓]*)([\s\S]*?)([\s.]*)$/u);
      if(m&&m[2]&&UA[m[2]]!=null)r=m[1]+UA[m[2]]+m[3];
      else if(/[a-ząćęłńóśźż]{3}/i.test(s))MISS.add(s)}
  }
  return a.length?r.replace(/\{(\d)\}/g,(_,i)=>a[+i]):r;
}

 bins:["Współczulny","Przywspółczulny"],
 items:[
 {a:"Rozszerzenie źrenic",b:0,e:"Więcej światła trafia do oka w sytuacji zagrożenia."},
 {a:"Przyspieszenie akcji serca",b:0,e:"Więcej krwi dla mięśni przy wysiłku i stresie."},
 {a:"Rozszerzenie oskrzeli",b:0,e:"Ułatwia pobieranie tlenu."},
 {a:"Hamowanie trawienia",b:0,e:"Energia trafia do mięśni zamiast do jelit."},
 {a:"Uwalnianie glukozy z wątroby",b:0,e:"Szybkie paliwo dla mięśni i mózgu."},
 {a:"Pobudzenie rdzenia nadnerczy",b:0,e:"Rdzeń nadnerczy to środek gruczołu leżącego na nerce. Pobudzony przez nerwy współczulne wyrzuca do krwi adrenalinę, która wzmacnia reakcję „walcz lub uciekaj” w całym ciele."},
 {a:"Zwężenie źrenic",b:1,e:"Typowe dla stanu spoczynku."},
 {a:"Zwolnienie akcji serca",b:1,e:"Głównie przez nerw błędny."},
 {a:"Wydzielanie śliny i soków trawiennych",b:1,e:"„Odpoczywaj i traw”."},
 {a:"Nasilenie perystaltyki jelit",b:1,e:"Przesuwanie treści pokarmowej."},
 {a:"Nerw błędny (X)",b:1,e:"Dziesiąty nerw czaszkowy: „błądzi” od pnia mózgu aż do brzucha. To główna droga części przywspółczulnej: zwalnia serce i pobudza trawienie."},
 {a:"Przekaźnik zazwojowy: acetylocholina",b:1,e:"Neuron zazwojowy to ostatni neuron w łańcuchu, ten za zwojem, który dochodzi do narządu. W części przywspółczulnej uwalnia acetylocholinę, a w współczulnej zwykle noradrenalinę."}]},
{id:"lobes",title:"Płaty mózgu i ich funkcje",kind:"diagram",svg:SVG_BRAIN,

 {n:2,a:"Płat ciemieniowy",e:"Kora somatosensoryczna (zakręt zaśrodkowy), orientacja i uwaga przestrzenna."},
 {n:3,a:"Płat skroniowy",e:"Kora słuchowa, rozumienie mowy (Wernicke), rozpoznawanie twarzy i obiektów. Przyśrodkowo: hipokamp i ciało migdałowate."},
 {n:4,a:"Płat potyliczny",e:"Pierwszorzędowa kora wzrokowa (V1). Obustronne uszkodzenie daje ślepotę korową."},
 {n:5,a:"Móżdżek",e:"Koordynacja i precyzja ruchów, równowaga, odmierzanie czasu, uczenie ruchowe."},
 {n:6,a:"Pień mózgu",e:"Rdzeń przedłużony, most i śródmózgowie: oddychanie, praca serca, czuwanie (twór siatkowaty), jądra nerwów czaszkowych."}],
 extra:[{a:"Wyspa",e:"Kora wyspy leży w głębi bruzdy bocznej i nie jest widoczna z boku. Odpowiada m.in. za interocepcję i smak."}],

  {n:3,q:"Płat skroniowy",a:"👂 Słuch i rozpoznawanie twarzy",e:"Kora słuchowa i zakręt wrzecionowaty. Uszkodzenie: prozopagnozja."},

{t:"Struktura a funkcja",levels:[
{id:"cbg",title:"Kora, móżdżek, jądra podstawne",kind:"sort",
 intro:"Rozłóż cechy i objawy do trzech struktur.",
 bins:["Kora mózgowa","Móżdżek","Jądra podstawne"],
 items:[
 {a:"Sześć warstw komórek (kora nowa)",b:0,e:"Kora nowa (ewolucyjnie najmłodsza, ok. 90% kory) ma sześć warstw neuronów, jedna nad drugą. Móżdżek i jądra podstawne mają inną budowę."},
 {a:"Planowanie i podejmowanie decyzji",b:0,e:"Kora przedczołowa, czyli przednia część płata czołowego, układa plan, przewiduje skutki i hamuje impulsy."},
 {a:"Świadoma percepcja i język",b:0,e:"Świadomie widzimy i słyszymy dzięki korom czuciowym. Mowę tworzą i rozumieją ośrodki Broki i Wernickego, które też leżą w korze."},
 {a:"Ataksja i drżenie zamiarowe po uszkodzeniu",b:1,e:"Ataksja to niezgrabne, źle skoordynowane ruchy. Drżenie zamiarowe: ręka drży tym mocniej, im bliżej celu. Oba objawy wskazują na móżdżek."},
 {a:"Precyzyjne odmierzanie czasu (timing)",b:1,e:"Móżdżek mierzy krótkie odstępy czasu: kiedy zatrzymać rękę, kiedy uderzyć w rytm. Osoby z jego uszkodzeniem gorzej stukają do rytmu."},
 {a:"Więcej neuronów niż cała reszta mózgowia",b:1,e:"Móżdżek jest mały, ale ma ok. 80% wszystkich neuronów mózgu, głównie maleńkie komórki ziarniste."},
 {a:"Warunkowanie odruchu mrugania",b:1,e:"Eksperyment: dźwięk, a tuż po nim dmuchnięcie w oko. Po kilku próbach mrugamy już na sam dźwięk. Tego wyuczonego mrugnięcia uczy się móżdżek (badania Thompsona)."},
 {a:"Prążkowie: jądro ogoniaste + skorupa",b:2,e:"Jądra podstawne to skupiska neuronów głęboko pod korą. Ich główna część, prążkowie, składa się z jądra ogoniastego i skorupy."},
 {a:"Choroba Parkinsona",b:2,e:"Giną neurony istoty czarnej, które dostarczają dopaminę do jąder podstawnych. Skutek: spowolnienie, sztywność, drżenie w spoczynku, trudność z rozpoczęciem ruchu."},
 {a:"Pląsawica Huntingtona",b:2,e:"Choroba dziedziczna, w której obumierają neurony prążkowia. Pojawiają się mimowolne, „tańczące” ruchy (pląsawica), później zaburzenia psychiczne i otępienie."},
 {a:"Wybór ruchu i tworzenie nawyków",b:2,e:"Jądra podstawne działają jak hamulec: przepuszczają tylko wybrany ruch, a resztę blokują. Przez powtarzanie utrwalają nawyki."}]},
{id:"cases",title:"Przypadki uszkodzeń mózgu",kind:"match",
 intro:"Dopasuj uszkodzoną strukturę do opisu przypadku.",
 slots:[
 {q:"Phineas Gage: po przebiciu czaszki prętem stał się impulsywny i nieodpowiedzialny, choć intelekt pozostał.",a:"Kora przedczołowa",e:"Phineas Gage (1848): metalowy pręt przebił mu przednią część płata czołowego. Przeżył i myślał sprawnie, ale stał się impulsywny i nie umiał planować. Kora przedczołowa łączy emocje z decyzjami i hamuje impulsy."},
 {q:"Pacjent H.M.: po obustronnej operacji przyśrodkowych płatów skroniowych nie tworzy nowych wspomnień o faktach i zdarzeniach.",a:"Hipokamp",e:"H.M. (Henry Molaison) w 1953 r. miał usunięte obie przyśrodkowe części płatów skroniowych z hipokampami, żeby leczyć padaczkę. Pamiętał przeszłość, ale nie zapamiętywał nowych faktów i zdarzeń (amnezja następcza). Nowych umiejętności ruchowych uczył się nadal."},
 {q:"Mówi z trudem i telegraficznie, ale dobrze rozumie mowę.",a:"Ośrodek Broki",e:"Ośrodek Broki leży w lewym płacie czołowym. Gdy jest uszkodzony, chory wie, co chce powiedzieć, ale mówi z trudem, krótko, bez małych słów gramatycznych (mowa telegraficzna). Rozumie dobrze. To afazja ruchowa."},
 {q:"Mówi płynnie, lecz bez sensu i słabo rozumie, co się do niego mówi.",a:"Ośrodek Wernickego",e:"Ośrodek Wernickego leży w lewym płacie skroniowym, przy korze słuchowej. Uszkodzenie: chory nie rozumie słów, a sam mówi płynnie, lecz bez sensu, często wymyślonymi słowami. To afazja czuciowa."},
 {q:"Pacjentka S.M. (choroba Urbacha-Wiethego) nie odczuwa strachu i nie rozpoznaje go na twarzach.",a:"Ciało migdałowate",e:"Ciało migdałowate to struktura w kształcie migdała w głębi płata skroniowego, która ocenia zagrożenie. U pacjentki S.M. rzadka choroba genetyczna (choroba Urbacha-Wiethego) zwapniła oba ciała migdałowate, więc S.M. nie czuje strachu."},
 {q:"Ignoruje lewą stronę przestrzeni: je tylko z prawej połowy talerza.",a:"Prawy płat ciemieniowy",e:"Płat ciemieniowy kieruje uwagą w przestrzeni. Po udarze prawego płata chory nie zauważa lewej strony świata: je z połowy talerza, rysuje pół zegara. To zaniedbywanie jednostronne (neglect), a oczy są zdrowe."},
 {q:"Widzi twarze bliskich wyraźnie, ale ich nie rozpoznaje.",a:"Zakręt wrzecionowaty",e:"Zakręt wrzecionowaty to fałd kory na spodzie płata skroniowego, wyspecjalizowany w twarzach. Uszkodzenie daje prozopagnozję, czyli „ślepotę na twarze”: chory rozpoznaje bliskich dopiero po głosie."},
 {q:"Chwiejny chód, niezgrabne ruchy, drżenie przy sięganiu po kubek.",a:"Móżdżek",e:"Uszkodzony móżdżek nie poprawia ruchu w trakcie: chód jest chwiejny jak po alkoholu, a ręka drży, gdy zbliża się do celu. To ataksja móżdżkowa."}],
 extra:[{a:"Wzgórze",e:"Wzgórze to stacja przekaźnikowa w środku mózgu, która przesyła do kory informacje ze zmysłów. Żaden z opisanych objawów nie wynika z jego uszkodzenia."}]}
]},
{t:"Neuron i synapsa",levels:[
{id:"neuron",title:"Budowa neuronu",kind:"diagram",svg:SVG_NEURON,
 intro:"Nazwij części neuronu ruchowego oznaczone numerami.",
 slots:[
 {n:1,a:"Dendryty",e:"Rozgałęzione wypustki, które jak anteny odbierają sygnały od innych neuronów. Na nich są kolce dendrytyczne, małe wypustki, w których leżą synapsy."},
 {n:2,a:"Ciało komórki (soma)",e:"Zawiera jądro, rybosomy i mitochondria; sumuje napływające potencjały."},
 {n:3,a:"Jądro komórkowe",e:"Przechowuje DNA i steruje syntezą białek."},
 {n:4,a:"Wzgórek aksonu",e:"Miejsce, w którym akson odchodzi od ciała komórki. Jest tu najwięcej kanałów sodowych, więc to tu zapada decyzja, czy wysłać impuls."},
 {n:5,a:"Osłonka mielinowa",e:"Tłuszczowa izolacja owinięta wokół aksonu; przyspiesza przewodzenie. W mózgu i rdzeniu tworzą ją oligodendrocyty, w nerwach obwodowych komórki Schwanna. W stwardnieniu rozsianym mielina jest niszczona."},
 {n:6,a:"Przewężenie Ranviera",e:"Krótka przerwa w mielinie. Impuls przeskakuje od przewężenia do przewężenia (przewodzenie skokowe), dlatego biegnie dużo szybciej."},
 {n:7,a:"Zakończenia presynaptyczne",e:"Kolbki na końcach aksonu. W środku są pęcherzyki z neuroprzekaźnikiem, który wypuszczają do synapsy."}],
 extra:[{a:"Astrocyt",e:"Komórka glejowa regulująca środowisko neuronów i przepływ krwi. Nie tworzy mieliny."}]},
{id:"ap",title:"Potencjał czynnościowy",kind:"seq",
 intro:"Ułóż etapy powstawania potencjału czynnościowego w kolejności.",
 slots:[
 {a:"Spoczynek: ok. −70 mV, wnętrze ujemne",e:"W spoczynku wnętrze neuronu ma ok. −70 mV względem otoczenia. Utrzymuje to pompa sodowo-potasowa: wyrzuca 3 jony Na⁺ i wciąga 2 jony K⁺."},
 {a:"Depolaryzacja do progu (ok. −55 mV)",e:"Depolaryzacja: wnętrze staje się mniej ujemne. Gdy pobudzenia z dendrytów zsumują się do progu (ok. −55 mV) na wzgórku aksonu, startuje impuls."},
 {a:"Otwarcie kanałów Na⁺, Na⁺ wpływa",e:"Kanały bramkowane napięciem otwierają się, gdy zmienia się napięcie błony. Na⁺ wpada do środka i otwiera kolejne kanały. Dlatego impuls jest „wszystko albo nic”: albo pełny, albo żaden."},
 {a:"Szczyt ok. +30 mV, inaktywacja kanałów Na⁺",e:"Wnętrze staje się dodatnie (ok. +30 mV). Kanały Na⁺ zamykają się na zatrzask (inaktywacja) i przez chwilę nie da się ich otworzyć: to bezwzględny okres refrakcji."},
 {a:"Kanały K⁺ otwarte, K⁺ wypływa: repolaryzacja",e:"Kanały potasowe otwierają się później niż sodowe. K⁺ wypływa na zewnątrz, więc wnętrze znów staje się ujemne: to repolaryzacja."},
 {a:"Hiperpolaryzacja następcza",e:"Kanały K⁺ zamykają się z opóźnieniem, więc napięcie spada na chwilę poniżej spoczynkowego (ok. −80 mV). W tym czasie (względny okres refrakcji) potrzeba silniejszego bodźca."},
 {a:"Powrót do spoczynku, impuls biegnie dalej",e:"Napięcie wraca do −70 mV. Impuls biegnie dalej wzdłuż aksonu, ale nie zawraca, bo odcinek za nim jest jeszcze w refrakcji."}]},
{id:"syn",title:"Przekaźnictwo synaptyczne",kind:"seq",
 intro:"Ułóż zdarzenia w synapsie chemicznej we właściwej kolejności.",
 slots:[
 {a:"Impuls dociera do zakończenia presynaptycznego",e:"Potencjał czynnościowy dobiega aksonem do kolbki synaptycznej. Neuroprzekaźnik czeka tam już spakowany w pęcherzykach."},
 {a:"Kanały Ca²⁺ otwierają się, wapń wpływa",e:"Zmiana napięcia otwiera kanały wapniowe. Wpływający Ca²⁺ to sygnał: wypuść przekaźnik."},
 {a:"Pęcherzyki zlewają się z błoną (egzocytoza)",e:"Egzocytoza: pęcherzyk zlewa się z błoną komórki i wylewa zawartość na zewnątrz, do szczeliny."},
 {a:"Przekaźnik dyfunduje przez szczelinę",e:"Szczelina synaptyczna to wąska przerwa (ok. 20–40 nm) między neuronami. Przekaźnik pokonuje ją w ułamku milisekundy."},
 {a:"Przekaźnik wiąże się z receptorami postsynaptycznymi",e:"Przekaźnik pasuje do receptora jak klucz do zamka. Receptory jonotropowe to kanały i otwierają się od razu; metabotropowe działają wolniej, przez reakcje wewnątrz komórki."},
 {a:"Powstaje EPSP lub IPSP",e:"EPSP (pobudzający potencjał postsynaptyczny) przybliża neuron do progu, IPSP (hamujący) go oddala. Neuron sumuje je wszystkie."},
 {a:"Wychwyt zwrotny lub rozkład enzymatyczny",e:"Sprzątanie szczeliny: transportery wciągają przekaźnik z powrotem do neuronu (wychwyt zwrotny) albo enzym go rozkłada, np. acetylocholinoesteraza rozkłada acetylocholinę."}]}
]},
{t:"Neuroprzekaźniki i psychofarmakologia",levels:[
{id:"nt",title:"Neuroprzekaźniki i zaburzenia",kind:"match",
 intro:"Dopasuj neuroprzekaźnik do opisu jego roli.",
 slots:[
 {q:"Główny przekaźnik pobudzający; kluczowy dla LTP; w nadmiarze uszkadza neurony (ekscytotoksyczność).",a:"Glutaminian",e:"Najczęstszy przekaźnik pobudzający. Bierze udział w LTP, czyli wzmacnianiu synaps przy uczeniu. Gdy jest go za dużo (np. po udarze), zamęcza neurony na śmierć: to ekscytotoksyczność."},
 {q:"Główny przekaźnik hamujący w mózgu; jego działanie nasilają benzodiazepiny i alkohol.",a:"GABA",e:"Główny hamulec mózgu: otwiera kanały dla jonów Cl⁻, co oddala neuron od progu. Leki uspokajające (benzodiazepiny) i alkohol wzmacniają jego działanie."},
 {q:"Nagroda, motywacja i ruch; nadmiar w drodze mezolimbicznej łączy się z objawami pozytywnymi schizofrenii.",a:"Dopamina",e:"Przekaźnik nagrody, motywacji i ruchu. Nadmiar w drodze mezolimbicznej (ze śródmózgowia do układu nagrody) wiąże się z objawami pozytywnymi schizofrenii, czyli urojeniami i omamami. Niedobór w prążkowiu daje chorobę Parkinsona."},
 {q:"Nastrój, sen, apetyt, impulsywność; cel leków SSRI.",a:"Serotonina",e:"Wpływa na nastrój, sen, apetyt i kontrolę impulsów. Leki SSRI na depresję zwiększają jej ilość w synapsie."},
 {q:"Złącze nerwowo-mięśniowe, uwaga i pamięć; w chorobie Alzheimera giną neurony, które go wytwarzają.",a:"Acetylocholina",e:"Przekazuje polecenie z nerwu do mięśnia (złącze nerwowo-mięśniowe). W mózgu wspiera uwagę i pamięć. W chorobie Alzheimera giną neurony jądra podstawnego Meynerta, główne źródło acetylocholiny dla kory."},
 {q:"Czujność i pobudzenie; główne źródło to miejsce sinawe.",a:"Noradrenalina",e:"Podnosi czujność i gotowość do działania. Wytwarza ją głównie miejsce sinawe (locus coeruleus), małe niebieskawe jądro w pniu mózgu."},
 {q:"Endogenne opioidy: łagodzą ból i stres.",a:"Endorfiny",e:"Endogenne znaczy wytwarzane przez sam organizm. Endorfiny to naturalne opioidy: działają na te same receptory co morfina i tłumią ból, np. przy dużym wysiłku."}],
 extra:[{a:"Kortyzol",e:"To hormon kory nadnerczy, a nie neuroprzekaźnik."}]},
{id:"drugs",title:"Psychofarmakologia",kind:"match",
 intro:"Dopasuj substancję do mechanizmu działania.",
 slots:[
 {q:"Blokuje wychwyt zwrotny serotoniny; lek przeciwdepresyjny.",a:"Fluoksetyna (SSRI)",e:"SSRI to selektywny inhibitor wychwytu zwrotnego serotoniny: blokuje „odkurzacz”, więc serotoniny zostaje więcej w szczelinie. Nastrój poprawia się dopiero po kilku tygodniach."},
 {q:"Wzmacnia działanie GABA na receptor GABA-A; działa przeciwlękowo i nasennie.",a:"Diazepam (benzodiazepina)",e:"Przyczepia się do receptora GABA-A i wzmacnia hamujące działanie GABA: uspokaja, usypia, rozluźnia mięśnie. Grozi uzależnieniem, a z alkoholem może zatrzymać oddech."},
 {q:"Blokuje receptory dopaminowe D2; klasyczny lek przeciwpsychotyczny.",a:"Haloperidol",e:"Antagonista zajmuje receptor, ale go nie pobudza. Haloperidol blokuje receptory dopaminowe D2 i łagodzi urojenia i omamy. Skutek uboczny: sztywność i drżenie jak w Parkinsonie (objawy pozapiramidowe)."},
 {q:"Prekursor dopaminy przechodzący przez barierę krew–mózg.",a:"L-DOPA",e:"Dopamina z tabletki nie przejdzie z krwi do mózgu, bo zatrzyma ją bariera krew–mózg. L-DOPA przechodzi i dopiero w mózgu zamienia się w dopaminę. Tak leczy się Parkinsona."},
 {q:"Hamuje acetylocholinoesterazę, wydłużając działanie ACh.",a:"Donepezil",e:"Acetylocholinoesteraza to enzym, który rozkłada acetylocholinę. Donepezil go hamuje, więc acetylocholiny jest więcej, co nieco poprawia pamięć w chorobie Alzheimera."},
 {q:"Blokuje transportery wychwytu zwrotnego dopaminy (oraz NA i 5-HT).",a:"Kokaina",e:"Transporter to białko, które wciąga przekaźnik z powrotem do neuronu. Kokaina je blokuje, więc dopamina dłużej pobudza receptory: euforia."},
 {q:"Odwraca działanie transporterów i zwiększa uwalnianie dopaminy.",a:"Amfetamina",e:"Odwraca transportery: zamiast wciągać dopaminę, wypychają ją z neuronu, nawet bez impulsu."},
 {q:"Antagonista receptorów opioidowych; odwraca przedawkowanie opioidów.",a:"Nalokson",e:"Antagonista receptorów opioidowych: wypiera heroinę czy morfinę z receptora. Przy przedawkowaniu przywraca oddech w kilka minut."}],
 extra:[{a:"Lit",e:"Stabilizator nastroju w chorobie dwubiegunowej; jego mechanizm nie jest w pełni poznany."}]}
]},
{t:"Hormony, stres i emocje",levels:[
{id:"hpa",title:"Oś stresu HPA",kind:"chain",
 intro:"Zbuduj oś podwzgórze–przysadka–nadnercza. Uwaga: dwie karty nie pasują.",
 slots:[
 {q:"Struktura mózgu, która uruchamia odpowiedź na stresor",a:"Podwzgórze",e:"Podwzgórze to małe centrum sterowania tuż pod wzgórzem, które łączy mózg z hormonami. Na stres reaguje jego jądro przykomorowe."},
 {q:"Hormon, który wydziela",a:"CRH (kortykoliberyna)",e:"CRH płynie krótkimi naczyniami krwionośnymi do przysadki i każe jej działać."},
 {q:"Gruczoł, który odbiera ten sygnał",a:"Przysadka (płat przedni)",e:"Przysadka to gruczoł wielkości ziarnka grochu pod mózgiem, który steruje innymi gruczołami. Na CRH odpowiada jej przedni płat."},
 {q:"Hormon wydzielany przez ten gruczoł",a:"ACTH",e:"ACTH (hormon adrenokortykotropowy) płynie z krwią z przysadki do nadnerczy."},
 {q:"Gruczoł docelowy",a:"Kora nadnerczy",e:"Nadnercza to gruczoły leżące na nerkach. Ich zewnętrzna warstwa (kora) wydziela kortyzol, a środek (rdzeń) adrenalinę."},
 {q:"Końcowy hormon; hamuje zwrotnie podwzgórze i przysadkę",a:"Kortyzol",e:"Kortyzol podnosi cukier we krwi i tłumi stan zapalny. Działa też wstecz: hamuje podwzgórze i przysadkę, żeby wyłączyć alarm (ujemne sprzężenie zwrotne). Długo podwyższony szkodzi hipokampowi."}],
 extra:[{a:"Adrenalina",e:"Należy do szybkiej osi współczulno-nadnerczowej (SAM), wydziela ją rdzeń nadnerczy."},{a:"TSH",e:"Hormon tyreotropowy steruje tarczycą, nie nadnerczami."}]},
{id:"horm",title:"Hormony a zachowanie",kind:"match",
 intro:"Dopasuj hormon do jego wpływu na zachowanie.",
 slots:[
 {q:"Więź matka–dziecko, zaufanie, skurcze porodowe, wypływ mleka.",a:"Oksytocyna",e:"Powstaje w podwzgórzu, a uwalnia ją tylny płat przysadki. Wywołuje skurcze porodowe i wypływ mleka, wzmacnia więź i zaufanie."},
 {q:"Wydzielana przez szyszynkę w ciemności; sygnalizuje noc.",a:"Melatonina",e:"Szyszynka, mały gruczoł w środku mózgu, wydziela ją, gdy jest ciemno. To sygnał: noc, pora spać."},
 {q:"Związany z dominacją i agresją; maskulinizuje mózg w okresie płodowym.",a:"Testosteron",e:"Hormon płciowy męski (występuje też u kobiet). Przed narodzinami trwale kształtuje mózg (efekt organizacyjny), a w dorosłości nasila dominację i agresję (efekt aktywacyjny)."},
 {q:"Zatrzymuje wodę w nerkach; u samców nornic preriowych wiąże się z monogamią.",a:"Wazopresyna",e:"Hormon antydiuretyczny: sprawia, że nerki zatrzymują wodę. Nornice preriowe to gryzonie żyjące w stałych parach; u ich samców wazopresyna wiąże się z przywiązaniem do partnerki."},
 {q:"Hormon tarczycy; niedobór w rozwoju prowadzi do niepełnosprawności intelektualnej.",a:"Tyroksyna",e:"Hormon tarczycy, przyspiesza przemianę materii. Jest niezbędny do rozwoju mózgu: jego brak u dziecka daje niepełnosprawność intelektualną (kretynizm), dlatego bada się każdego noworodka."},
 {q:"Wydzielana przez żołądek przed posiłkiem; nasila głód.",a:"Grelina",e:"Hormon głodu z pustego żołądka. Pobudza ośrodek głodu w podwzgórzu (jądro łukowate)."},
 {q:"Wydzielana przez tkankę tłuszczową; informuje podwzgórze o zapasach energii.",a:"Leptyna",e:"Wydzielają ją komórki tłuszczowe: im więcej tłuszczu, tym więcej leptyny i mniejszy apetyt. Myszy bez leptyny jedzą bez końca."}],
 extra:[{a:"Insulina",e:"Obniża poziom glukozy we krwi; żaden opis tu do niej nie pasuje."}]},
{id:"fear",title:"Strach według LeDoux",kind:"match",
 intro:"Widzisz coś wężowatego na ścieżce. Ułóż obwód strachu.",
 slots:[
 {q:"Pierwsza stacja przekaźnikowa bodźca wzrokowego",a:"Wzgórze",e:"Wzgórze przekazuje sygnały ze zmysłów dalej. Tu informacja się rozdziela: krótką drogą do ciała migdałowatego i długą do kory."},
 {q:"Droga niska: szybka, zgrubna ocena zagrożenia trafia bezpośrednio do…",a:"Ciało migdałowate",e:"Droga niska to skrót wzgórze → ciało migdałowate. Obraz jest zgrubny, ale alarm włącza się w ułamku sekundy, zanim wiesz, co widzisz."},
 {q:"Droga wysoka: dokładna analiza (wąż czy patyk?)",a:"Kora czuciowa",e:"Droga wysoka biegnie przez korę. Trwa dłużej, ale daje dokładny obraz (wąż czy patyk?). Kora może potwierdzić albo odwołać alarm."},
 {q:"Kontekst: czy w tym miejscu już coś mi groziło?",a:"Hipokamp",e:"Hipokamp zapamiętuje miejsca i sytuacje. Dzięki niemu boimy się w miejscu, w którym kiedyś coś się stało (warunkowanie kontekstowe)."},
 {q:"Uruchamia reakcję hormonalną i autonomiczną",a:"Podwzgórze",e:"Podwzgórze uruchamia ciało: oś stresu HPA (kortyzol) i układ współczulny (szybsze serce)."},
 {q:"Wywołuje zamieranie (freezing)",a:"Istota szara okołowodociągowa",e:"Istota szara okołowodociągowa (PAG) w śródmózgowiu włącza zachowania obronne, np. zamarcie w bezruchu (freezing)."},
 {q:"Hamuje ciało migdałowate przy wygaszaniu strachu",a:"Przyśrodkowa kora przedczołowa",e:"Przyśrodkowa kora przedczołowa hamuje ciało migdałowate, gdy uczymy się, że coś jest już bezpieczne (wygaszanie strachu). Na tym opiera się terapia ekspozycyjna: stopniowe, bezpieczne oswajanie lęku."}],
 extra:[{a:"Móżdżek",e:"Nie należy do głównego obwodu strachu opisanego przez LeDoux."}]}
]},
{t:"Uczenie się, pamięć, plastyczność",levels:[
{id:"mem",title:"Systemy pamięci",kind:"match",
 intro:"Dopasuj rodzaj pamięci lub uczenia do struktury.",
 slots:[
 {q:"Konsolidacja nowych faktów i zdarzeń (pamięć deklaratywna)",a:"Hipokamp",e:"Pamięć deklaratywna to fakty i zdarzenia, które da się opowiedzieć. Hipokamp je utrwala (konsolidacja); bez hipokampów H.M. nie zapamiętywał nic nowego."},
 {q:"Nawyki i pamięć proceduralna (np. jazda na rowerze)",a:"Prążkowie",e:"Pamięć proceduralna to umiejętności i nawyki: się ich nie opowiada, tylko wykonuje. Uczy jej prążkowie w jądrach podstawnych."},
 {q:"Warunkowanie klasyczne odruchu mrugania",a:"Móżdżek",e:"Dźwięk, a tuż po nim dmuchnięcie w oko: po kilku razach mrugamy na sam dźwięk. Ten prosty wyuczony odruch zapisuje móżdżek."},
 {q:"Warunkowanie strachu i pamięć emocjonalna",a:"Ciało migdałowate",e:"Ciało migdałowate zapamiętuje, co jest groźne. Dlatego silne emocje zostawiają mocne wspomnienia."},
 {q:"Pamięć robocza: utrzymanie informacji przez kilka sekund",a:"Grzbietowo-boczna kora przedczołowa",e:"Pamięć robocza to notatnik w głowie: trzymasz w niej np. numer telefonu przez kilka sekund. Robi to grzbietowo-boczna (górno-boczna) część kory przedczołowej."},
 {q:"Wiedza semantyczna o znaczeniu pojęć",a:"Przedni płat skroniowy",e:"Wiedza semantyczna to znaczenia słów i pojęć, np. czym jest pies. Gdy przednie płaty skroniowe zanikają, chory traci znaczenia słów: to otępienie semantyczne."}],
 extra:[{a:"Rdzeń kręgowy",e:"Realizuje odruchy, ale nie przechowuje opisanych rodzajów pamięci."}]},
{id:"ltp",title:"Długotrwałe wzmocnienie synaptyczne (LTP)",kind:"seq",
 intro:"Ułóż mechanizm LTP w hipokampie krok po kroku.",
 slots:[
 {a:"Silna, szybka stymulacja: dużo glutaminianu",e:"LTP to długotrwałe wzmocnienie synapsy, komórkowy ślad uczenia. Zaczyna się od szybkiej serii impulsów (stymulacja tetaniczna) i dużej porcji glutaminianu."},
 {a:"Receptory AMPA wpuszczają Na⁺, błona się depolaryzuje",e:"Receptory AMPA to szybkie kanały: po związaniu glutaminianu wpuszczają Na⁺ i neuron się depolaryzuje."},
 {a:"Depolaryzacja usuwa Mg²⁺ z kanału NMDA",e:"Receptor NMDA jest zatkany jonem magnezu, który wypycha dopiero silna depolaryzacja. NMDA otwiera się więc tylko wtedy, gdy oba neurony są aktywne naraz."},
 {a:"Ca²⁺ wpływa przez receptor NMDA",e:"Przez otwarty receptor NMDA wpływa wapń i to on uruchamia zmiany w synapsie."},
 {a:"Ca²⁺ aktywuje kinazy (m.in. CaMKII)",e:"Wapń włącza enzymy zwane kinazami (np. CaMKII), które zmieniają białka synapsy."},
 {a:"Do błony trafiają nowe receptory AMPA",e:"Kinazy powodują wbudowanie nowych receptorów AMPA. Później rosną też nowe kolce dendrytyczne."},
 {a:"Ten sam bodziec daje silniejszą odpowiedź",e:"Więcej receptorów AMPA to silniejsza odpowiedź na ten sam sygnał: synapsa zapamiętała doświadczenie."}]},
{id:"plast",title:"Neuroplastyczność w praktyce",kind:"match",
 intro:"Dopasuj przykład kliniczny lub eksperymentalny do zjawiska.",
 slots:[
 {q:"Londyńscy taksówkarze mają powiększoną tylną część hipokampa.",a:"Plastyczność zależna od doświadczenia",e:"Neuroplastyczność to zdolność mózgu do zmiany pod wpływem doświadczenia. Londyńscy taksówkarze latami uczą się mapy miasta i mają większy tylny hipokamp, odpowiedzialny za pamięć przestrzenną (badania Maguire)."},
 {q:"Po amputacji ręki dotyk twarzy wywołuje czucie w fantomowej dłoni.",a:"Reorganizacja mapy somatosensorycznej",e:"Na mapie czucia w korze obszar twarzy sąsiaduje z obszarem ręki. Po amputacji twarz zajmuje nieużywany obszar ręki, więc dotyk policzka czuje się w nieistniejącej dłoni (Ramachandran)."},
 {q:"U osób niewidomych czytanie Braille'a aktywuje korę wzrokową.",a:"Plastyczność międzymodalna",e:"Międzymodalna znaczy „między zmysłami”. Kora wzrokowa niewidomych nie stoi pusta, tylko przejmuje dotyk i słuch."},
 {q:"Kocięta z zasłoniętym jednym okiem w pierwszych tygodniach życia trwale tracą nim widzenie.",a:"Okres krytyczny",e:"Okres krytyczny to czas we wczesnym rozwoju, w którym mózg musi dostać bodźce, żeby prawidłowo się połączyć. Kocięta z zasłoniętym w tym czasie okiem nie odzyskały nim widzenia (Hubel i Wiesel)."},
 {q:"Szczury w klatkach z zabawkami i towarzystwem mają grubszą korę i więcej rozgałęzień dendrytów.",a:"Środowisko wzbogacone",e:"Szczury w klatkach z zabawkami i towarzystwem miały grubszą korę i bardziej rozgałęzione dendryty niż szczury w pustych klatkach (Rosenzweig)."},
 {q:"Unieruchomienie zdrowej ręki zmusza pacjenta po udarze do używania niedowładnej.",a:"Terapia wymuszonego ruchu",e:"Terapia wymuszonego ruchu (CIMT): unieruchamia się zdrową rękę, żeby pacjent po udarze ćwiczył chorą. Mózg się przebudowuje i ręka odzyskuje sprawność."}],
 extra:[{a:"Ekscytotoksyczność",e:"To mechanizm uszkodzenia neuronów przez nadmiar glutaminianu, a nie przykład plastyczności."}]}
]},
{t:"Rozwój, geny i ewolucja",levels:[
{id:"dev",title:"Rozwój układu nerwowego",kind:"seq",
 intro:"Ułóż etapy rozwoju układu nerwowego chronologicznie.",
 slots:[
 {a:"Zamknięcie cewy nerwowej (ok. 4. tydzień)",e:"Na początku ciąży płaska płytka komórek zwija się w rurkę, czyli cewę nerwową; powstanie z niej mózg i rdzeń. Gdy się nie zamknie, powstaje rozszczep kręgosłupa. Chroni przed tym kwas foliowy."},
 {a:"Proliferacja komórek w strefie przykomorowej",e:"Proliferacja to namnażanie. Komórki macierzyste dzielą się przy komorach mózgu (strefa przykomorowa) i tworzą miliardy przyszłych neuronów."},
 {a:"Migracja wzdłuż gleju radialnego",e:"Młode neurony wędrują na swoje miejsce po komórkach glejowych jak po linach (glej radialny). Gdy migracja zawiedzie, kora jest gładka, bez fałdów (lissencefalia)."},
 {a:"Różnicowanie: wzrost aksonów i dendrytów",e:"Różnicowanie: neuron „decyduje”, jakim neuronem będzie, i wypuszcza akson oraz dendryty."},
 {a:"Synaptogeneza",e:"Synaptogeneza to tworzenie synaps. Najwięcej powstaje w pierwszych latach życia."},
 {a:"Apoptoza i przycinanie synaps",e:"Zbędne neurony obumierają w zaplanowany sposób (apoptoza), a nieużywane synapsy są usuwane. Przeżywają neurony, które dostają czynniki wzrostu (neurotrofiny). Alkohol w ciąży nasila obumieranie (FAS, płodowy zespół alkoholowy)."},
 {a:"Koniec mielinizacji kory przedczołowej (ok. 20–25 r.ż.)",e:"Mielinizacja zaczyna się przed narodzeniem, ale w korze przedczołowej kończy się najpóźniej, ok. 20–25 r.ż. Stąd młodzi ludzie słabiej hamują impulsy."}]},
{id:"gen",title:"Genetyka zachowania",kind:"match",
 intro:"Dopasuj pojęcie do definicji lub przykładu.",
 slots:[
 {q:"Zestaw genów danego osobnika",a:"Genotyp",e:"Genotyp to zestaw genów, który dostajesz od rodziców."},
 {q:"Obserwowalne cechy, w tym zachowanie, zależne od genów i środowiska",a:"Fenotyp",e:"Fenotyp to to, co widać: wygląd, zdolności, zachowanie. Zależy od genów i środowiska."},
 {q:"Odsetek zmienności cechy w danej populacji przypisywany różnicom genetycznym",a:"Odziedziczalność",e:"Odziedziczalność (h²) mówi, jaka część różnic między ludźmi w danej grupie wynika z różnic w genach. Nic nie mówi o pojedynczej osobie i zmienia się, gdy zmienia się środowisko."},
 {q:"Bliźnięta mające niemal 100% wspólnych genów",a:"Bliźnięta monozygotyczne",e:"Monozygotyczne (jednojajowe) powstają z jednej zapłodnionej komórki, więc mają prawie te same geny."},
 {q:"Bliźnięta mające średnio 50% wspólnych genów",a:"Bliźnięta dizygotyczne",e:"Dizygotyczne (dwujajowe) powstają z dwóch komórek i genetycznie są jak zwykłe rodzeństwo. Jeśli MZ są do siebie bardziej podobne niż DZ, cecha jest częściowo dziedziczna."},
 {q:"Zmiana ekspresji genów bez zmiany sekwencji DNA, np. przez metylację",a:"Epigenetyka",e:"Epigenetyka to włączniki genów. Metylacja to doczepienie do DNA małych grup chemicznych, które wyłączają gen. Np. szczury mało lizane przez matkę jako dorosłe gorzej znoszą stres."},
 {q:"Wariant genu MAOA zwiększa ryzyko przemocy głównie u osób maltretowanych w dzieciństwie",a:"Interakcja gen–środowisko",e:"Gen działa różnie zależnie od środowiska. Słabszy wariant genu MAOA (enzymu rozkładającego m.in. serotoninę) zwiększał ryzyko przemocy tylko u osób krzywdzonych w dzieciństwie (Caspi, 2002)."},
 {q:"Choroba jednogenowa: dieta bez fenyloalaniny zapobiega niepełnosprawności intelektualnej",a:"Fenyloketonuria",e:"Przez jeden wadliwy gen organizm nie rozkłada fenyloalaniny (składnika białek), która gromadzi się i uszkadza mózg. Dieta bez fenyloalaniny od urodzenia zapobiega szkodom: geny to nie wyrok."}],
 extra:[{a:"Dryf genetyczny",e:"Losowe zmiany częstości alleli w małych populacjach; nie pasuje do żadnego opisu."}]},
{id:"evo",title:"Ewolucyjne podstawy zachowania",kind:"match",
 intro:"Dopasuj mechanizm ewolucyjny do przykładu.",
 slots:[
 {q:"Cechy zwiększające przeżycie i rozród stają się w populacji częstsze",a:"Dobór naturalny",e:"Osobniki z cechami, które pomagają przeżyć i mieć potomstwo, częściej przekazują swoje geny. Z pokolenia na pokolenie te cechy się upowszechniają (Darwin)."},
 {q:"Pawi ogon: cecha kosztowna, ale zwiększająca szanse na partnera",a:"Dobór płciowy",e:"Cecha może się rozpowszechnić, bo pomaga zdobyć partnera, nawet jeśli utrudnia przeżycie. Pawi ogon przyciąga samice, choć przeszkadza w ucieczce."},
 {q:"Pomaganie krewnym, z którymi dzielimy geny (reguła Hamiltona)",a:"Dobór krewniaczy",e:"Pomagając krewnym, pomagasz genom, które z nimi dzielisz. Reguła Hamiltona: pomoc się opłaca, gdy r × B > C (r to pokrewieństwo, B korzyść krewnego, C twój koszt)."},
 {q:"Pomagam ci teraz, bo liczę, że ty pomożesz mnie później",a:"Altruizm odwzajemniony",e:"Pomaganie obcym na zasadzie „ty mnie, ja tobie” (Trivers). Działa u gatunków, które rozpoznają się nawzajem i pamiętają przysługi."},
 {q:"Lęk przed wężami nabywamy łatwiej niż przed gniazdkami elektrycznymi",a:"Przygotowanie biologiczne",e:"Przygotowanie biologiczne (preparedness, Seligman): ewolucja nastawiła nas na szybkie uczenie się lęku przed dawnymi zagrożeniami (węże, pająki), a nie przed nowymi (gniazdka)."},
 {q:"Cecha ukształtowana przez dobór do pełnienia konkretnej funkcji",a:"Adaptacja",e:"Adaptacja to cecha, którą dobór ukształtował, bo pełniła konkretną funkcję. Nie każda cecha nią jest: niektóre to produkty uboczne innych."}],
 extra:[{a:"Dziedziczenie cech nabytych",e:"Pogląd Lamarcka, odrzucony przez współczesną biologię."}]}
]},
{t:"Metody badania mózgu",levels:[
{id:"eeg",title:"Odczytaj zapis EEG",kind:"match",
 intro:"Dopasuj wzorzec EEG do stanu lub zjawiska.",
 slots:[
 {q:"Fale delta, 0,5–4 Hz, duża amplituda",a:"Głęboki sen (N3)",e:"EEG zapisuje elektryczną aktywność kory elektrodami na głowie. Fale delta są wolne (0,5–4 drgania na sekundę) i wysokie, bo w głębokim śnie N3 neurony pracują razem, w jednym rytmie."},
 {q:"Fale theta, 4–8 Hz",a:"Senność, faza N1",e:"Fale theta (4–8 Hz) pojawiają się, gdy zasypiamy, czyli w fazie N1, najpłytszym śnie."},
 {q:"Fale alfa, 8–13 Hz, najsilniejsze nad potylicą",a:"Relaks z zamkniętymi oczami",e:"Fale alfa (8–13 Hz) to spokojny relaks z zamkniętymi oczami, najlepiej widoczny nad płatem potylicznym. Otwarcie oczu je wygasza."},
 {q:"Fale beta, 13–30 Hz, niska amplituda",a:"Czuwanie i skupienie",e:"Fale beta (13–30 Hz) są szybkie i niskie, bo przy czuwaniu i skupieniu neurony pracują niezależnie od siebie."},

/* ---- Potencjał czynnościowy ---- */
function simAP(root){
  const C=colors();
  const [mc,mx]=canvas(360,150),[gc,gx]=canvas(360,170);
  const phase=readout(),vread=el("b",{class:"bigv"},"−70 mV");
  const sl=el("input",{type:"range",min:"0",max:"30",value:"8",id:"ap-s"}),slv=el("span",null,tr("{0} mV",8));
  const blk=el("input",{type:"checkbox",id:"ap-ttx"});
  sl.oninput=()=>slv.textContent=tr("{0} mV",sl.value);
  root.append(
    el("div",{class:"simrow"},el("span",{class:"lbl"},"Błona aksonu"),vread),mc,gc,
    el("div",{class:"ctrl"},el("label",{for:"ap-s"},"Siła bodźca: ",slv),sl),
    el("div",{class:"ctrl inline"},el("button",{class:"btn pri",onclick:()=>stim(+sl.value)},"⚡ Pobudź"),
      el("label",{class:"chk",for:"ap-ttx"},blk," Zablokuj kanały Na⁺ (TTX)")),
    phase,
    el("p",{class:"try"},"Spróbuj: słaby bodziec, potem silny. Dwa słabe bodźce szybko po sobie. Bodziec tuż po szczycie."));
  let t=0,apStart=null;const passive=[],buf=[];const SPEED=1/300; // ms symulacji na ms rzeczywisty
  function apShape(a){if(a<0.6)return -55+85*smooth(a/0.6);if(a<1.8)return 30-110*smooth((a-0.6)/1.2);if(a<4.8)return -80+10*smooth((a-1.8)/3);return -70}
  function pas(s,d){if(d<0)return 0;if(d<0.3)return s*d/0.3;return s*Math.exp(-(d-0.3)/1.6)}
  function V(at){let v=-70;if(apStart!=null&&at>=apStart&&at-apStart<4.8)v=apShape(at-apStart);else{v=-70;for(const p of passive)v+=pas(p.s,at-p.t);if(apStart!=null&&at<apStart)v=-70+(-55+70)*smooth((at-(apStart-0.3))/0.3)}return v}
  let msg="";let msgT=0;
  function stim(s){
    const a=apStart!=null?t-apStart:99;
    if(a>=0&&a<2.4){msg="Bezwzględny okres refrakcji: kanały Na⁺ są zinaktywowane. Bodziec nic nie daje.";msgT=t;return}
    const thr=a<4.8?-40:-55;
    const cur=V(t)+s;
    if(!blk.checked&&cur>=thr){apStart=t+0.3;passive.length=0;msg=a<4.8?"Względny okres refrakcji pokonany silnym bodźcem.":"Próg przekroczony: wszystko albo nic!";}
    else{passive.push({s,t});msg=blk.checked&&cur>=thr?"Kanały Na⁺ zablokowane: mimo przekroczenia progu brak potencjału.":(a<4.8&&cur>=-55?"Względny okres refrakcji: próg jest teraz wyższy.":"Pod progiem: lokalna depolaryzacja wygasa.")}
    msgT=t;
  }
  const na=[60,160,260],k=[110,210,310];
  const parts=[];for(let i=0;i<46;i++)parts.push({x:Math.random()*360,y:Math.random()*50+5,ty:"na"});for(let i=0;i<46;i++)parts.push({x:Math.random()*360,y:Math.random()*45+100,ty:"k"});
  loop((now,dt)=>{
    t+=dt*SPEED;
    while(passive.length&&t-passive[0].t>8)passive.shift();
    const v=V(t);buf.push([t,v]);while(buf.length&&t-buf[0][0]>12)buf.shift();
    const a=apStart!=null?t-apStart:99;
    const naOpen=!blk.checked&&a>=0&&a<0.6,naInact=a>=0.6&&a<2.4,kOpen=a>=0.4&&a<3.0;
    // faza
    let ph="Potencjał spoczynkowy";if(a>=-0.3&&a<0)ph="Depolaryzacja do progu";else if(a>=0&&a<0.6)ph="Depolaryzacja: Na⁺ wpływa";else if(a>=0.6&&a<1.8)ph="Repolaryzacja: K⁺ wypływa";else if(a>=1.8&&a<4.8)ph="Hiperpolaryzacja · refrakcja";else if(v>-69)ph="Lokalna depolaryzacja";
    vread.textContent=tr("{0} mV",(v<0?"−":"+")+Math.abs(v).toFixed(0));
    phase.innerHTML="";phase.append(el("span",{class:"pill"},ph),t-msgT<6&&msg?el("span",null," "+msg):"");
    // błona
    mx.clearRect(0,0,360,150);
    mx.fillStyle=C.muted;mx.font="11px IBM Plex Sans, sans-serif";mx.fillText("ZEWNĄTRZ",6,14);mx.fillText("WNĘTRZE",6,146);
    mx.fillStyle=C.soft;mx.fillRect(0,62,360,24);
    const gate=(x,open,col,inact)=>{mx.fillStyle=col;mx.fillRect(x-12,58,8,32);mx.fillRect(x+4,58,8,32);if(!open){mx.fillRect(x-4,70,8,8)}if(inact){mx.beginPath();mx.arc(x,95,5,0,7);mx.fill()}};
    na.forEach(x=>gate(x,naOpen,C.eosin,naInact));k.forEach(x=>gate(x,kOpen,C.hema,false));
    mx.fillStyle=C.muted;mx.fillText("Na⁺",na[0]-10,108);mx.fillText("K⁺",k[0]-7,52);
    for(const p of parts){
      p.x+=(Math.random()-.5)*1.6;p.y+=(Math.random()-.5)*1.6;
      if(p.ty==="na"){
        if(naOpen&&p.y<60){const c=na.reduce((b,x)=>Math.abs(x-p.x)<Math.abs(b-p.x)?x:b);p.x+=(c-p.x)*.05;p.y+=1.4}
        if(p.y>58&&p.y<92){const c=na.find(x=>Math.abs(x-p.x)<6);if(c&&naOpen)p.y+=2.5;else if(p.y<75)p.y=56;else p.y=94}
        if(p.y>94&&!naOpen&&Math.random()<.01){p.y=Math.random()*40+5;p.x=Math.random()*360}
      }else{
        if(kOpen&&p.y>90){const c=k.reduce((b,x)=>Math.abs(x-p.x)<Math.abs(b-p.x)?x:b);p.x+=(c-p.x)*.05;p.y-=1.4}
        if(p.y>56&&p.y<92){const c=k.find(x=>Math.abs(x-p.x)<6);if(c&&kOpen)p.y-=2.5;else if(p.y>75)p.y=94;else p.y=56}
        if(p.y<56&&!kOpen&&Math.random()<.01){p.y=Math.random()*40+100;p.x=Math.random()*360}
      }
      p.x=(p.x+360)%360;p.y=clamp(p.y,4,146);
      mx.fillStyle=p.ty==="na"?C.eosin:C.hema;mx.beginPath();mx.arc(p.x,p.y,2.6,0,7);mx.fill();
    }
    // wykres
    gx.clearRect(0,0,360,170);
    const y=v=>10+(40-v)/130*140;
    gx.strokeStyle=C.line;gx.lineWidth=1;gx.font="10px IBM Plex Sans, sans-serif";gx.fillStyle=C.muted;
    [[30,"+30"],[0,"0"],[-55,"próg −55"],[-70,"−70"]].forEach(([v,l])=>{gx.setLineDash(v===-55?[4,4]:[]);gx.beginPath();gx.moveTo(40,y(v));gx.lineTo(356,y(v));gx.stroke();gx.fillText(l,2,y(v)+3)});
    gx.setLineDash([]);
    gx.strokeStyle=C.eosin;gx.lineWidth=2.2;gx.beginPath();
    buf.forEach(([bt,bv],i)=>{const X=356-(t-bt)/12*316;i?gx.lineTo(X,y(bv)):gx.moveTo(X,y(bv))});gx.stroke();
    gx.fillStyle=C.muted;gx.fillText("mV · ostatnie 12 ms",250,166);
  });
}

/* ---- Synapsa (z lekami) ---- */
function simSynapse(root,mode){
  const C=colors();
  const [c,x]=canvas(360,250),[gc,gx]=canvas(360,90);
  const info=readout();
  const DR=mode==="drugs"
   ?[["none","Bez leku"],["reup","Kokaina / SSRI"],["anta","Haloperidol"],["amph","Amfetamina"],["ache","Donepezil"]]
   :[["none","Normalnie"],["reup","Blokada wychwytu"],["anta","Blokada receptorów"]];
  let drug="none";
  const DESC={none:"Przekaźnik szybko znika: wychwyt zwrotny i rozkład.",reup:"Transportery zablokowane: przekaźnik zostaje dłużej w szczelinie, odpowiedź rośnie i trwa dłużej.",anta:"Antagonista siedzi na receptorach: przekaźnik jest, ale odpowiedzi brak.",amph:"Transportery działają odwrotnie: przekaźnik wycieka nawet bez impulsu.",ache:"Enzym rozkładający zablokowany (tu: ACh). Przekaźnik krąży dłużej."};
  root.append(c,el("div",{class:"simrow"},el("span",{class:"lbl"},"Odpowiedź postsynaptyczna (EPSP)")),gc,
    el("div",{class:"ctrl inline"},el("button",{class:"btn pri",onclick:fire},"⚡ Wyślij impuls")),
    chips(DR,"none",k=>{drug=k;if(k==="amph")amphT=5000;msg=DESC[k]}),info,
    el("p",{class:"try"},mode==="drugs"?"Wyślij impuls bez leku, potem z każdym lekiem. Porównaj wykres.":"Wyślij impuls kilka razy szybko. Potem zablokuj wychwyt i powtórz."));
  let msg=DESC.none;
  const R=[80,130,180,230,280].map(x=>({x,bound:0})),T=[45,315];
  let ves=[],nt=[],ca=[],hist=[],amphT=0;
  const mkVes=()=>{ves=[];for(let i=0;i<6;i++)ves.push({x:70+i*44+Math.random()*10,y:40+Math.random()*40,ty:40+Math.random()*40,st:"idle"})};mkVes();
  function fire(){for(let i=0;i<10;i++)ca.push({x:Math.random()<.5?30+Math.random()*30:300+Math.random()*30,y:108,life:600});
    ves.forEach((v,i)=>{if(v.st==="idle"){v.st="move";v.ty=100;v.delay=150+i*40}});later(()=>{if(ves.every(v=>v.st==="gone"))mkVes()},2200)}
  loop((now,dt)=>{
    x.clearRect(0,0,360,250);
    // presynaptyczny
    x.fillStyle=C.soft;x.strokeStyle=C.hema;x.lineWidth=2;
    x.beginPath();x.moveTo(20,0);x.lineTo(20,95);x.quadraticCurveTo(20,110,40,110);x.lineTo(320,110);x.quadraticCurveTo(340,110,340,95);x.lineTo(340,0);x.fill();x.stroke();
    x.beginPath();x.moveTo(20,250);x.lineTo(20,160);x.quadraticCurveTo(20,148,40,148);x.lineTo(320,148);x.quadraticCurveTo(340,148,340,160);x.lineTo(340,250);x.fill();x.stroke();
    x.fillStyle=C.muted;x.font="10px IBM Plex Sans, sans-serif";x.fillText("zakończenie presynaptyczne",26,14);x.fillText("szczelina",292,132);x.fillText("neuron postsynaptyczny",26,244);
    // transportery
    T.forEach(tx=>{x.fillStyle=(drug==="reup")?C.bad:C.good;x.fillRect(tx-9,104,18,10);if(drug==="reup"){x.strokeStyle=C.surface;x.lineWidth=2;x.beginPath();x.moveTo(tx-6,105);x.lineTo(tx+6,113);x.moveTo(tx+6,105);x.lineTo(tx-6,113);x.stroke()}});
    // receptory
    R.forEach(r=>{x.fillStyle=r.bound>0?C.eosin:C.hema;x.fillRect(r.x-9,144,18,12);if(drug==="anta"){x.fillStyle=C.ink;x.beginPath();x.arc(r.x,141,6,0,7);x.fill()}if(r.bound>0)r.bound-=dt;
      if(r.bound>0){x.fillStyle=C.eosin;x.globalAlpha=.25;x.fillRect(r.x-14,156,28,40);x.globalAlpha=1}});
    // wapń
    ca=ca.filter(p=>(p.life-=dt)>0);ca.forEach(p=>{p.y-=0.4;p.x+=(Math.random()-.5)*2;x.fillStyle=C.good;x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill()});
    // pęcherzyki
    ves.forEach(v=>{
      if(v.st==="move"){if((v.delay-=dt)<0){v.y+=(v.ty-v.y)*.12;if(Math.abs(v.y-v.ty)<1){v.st="gone";for(let i=0;i<9;i++)nt.push({x:v.x+(Math.random()-.5)*10,y:118,b:0,age:0})}}}
      if(v.st!=="gone"){x.strokeStyle=C.hema;x.fillStyle=C.surface;x.lineWidth=1.5;x.beginPath();x.arc(v.x,v.y,9,0,7);x.fill();x.stroke();x.fillStyle=C.eosin;for(let i=0;i<4;i++){x.beginPath();x.arc(v.x-3+(i%2)*6,v.y-3+(i>1)*6,1.8,0,7);x.fill()}}
    });
    // amfetamina: wyciek przez transportery
    if(drug==="amph"&&amphT>0){amphT-=dt;if(Math.random()<.12){const tx=T[Math.random()<.5?0:1];nt.push({x:tx,y:118,b:0,age:0})}}
    // przekaźnik
    const keep=[];
    for(const p of nt){
      if(p.b>0){p.b-=dt;x.fillStyle=C.eosin;x.beginPath();x.arc(p.x,p.y,2.4,0,7);x.fill();if(p.b<=0){p.y=130;p.age=700}keep.push(p);continue}
      p.age=(p.age||0)+dt;p.x+=(Math.random()-.5)*4;p.y+=(Math.random()-.5)*4+(p.age<700?.9:0);p.x=clamp(p.x,22,338);p.y=clamp(p.y,114,142);
      if(p.y>=140&&drug!=="anta"){const r=R.find(r=>Math.abs(r.x-p.x)<9&&r.bound<=0);if(r){r.bound=420;p.b=420;p.x=r.x;p.y=141}}
      let gone=false;
      if(p.age>700&&p.y<=117&&drug!=="reup"&&drug!=="amph"&&T.some(tx=>Math.abs(tx-p.x)<11)&&Math.random()<.6)gone=true;
      if(drug!=="ache"&&Math.random()<(drug==="reup"?.0008:.004))gone=true;
      if(drug==="ache"&&Math.random()<.0006)gone=true;
      if(!gone){keep.push(p);x.fillStyle=C.eosin;x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill()}
    }
    nt=keep.slice(-400);
    // wykres
    const b=R.filter(r=>r.bound>0).length;hist.push(b);if(hist.length>360)hist.shift();
    gx.clearRect(0,0,360,90);gx.strokeStyle=C.line;gx.beginPath();gx.moveTo(0,84);gx.lineTo(360,84);gx.stroke();
    gx.strokeStyle=C.eosin;gx.lineWidth=2;gx.beginPath();hist.forEach((h,i)=>{const X=360-hist.length+i,Y=84-h*15;i?gx.lineTo(X,Y):gx.moveTo(X,Y)});gx.stroke();
    info.innerHTML="";info.append(el("span",{class:"pill"},tr("W szczelinie: {0}",nt.length)),el("span",null," "+msg));
  });
}

  const NST=l0.stage2?2:1;
  const isSort=l.kind==="sort";
  const S={sel:null,mistakes:carry||0,done:false,place:isSort?l.items.map(()=>null):l.slots.map(()=>null),locked:new Set(),wrong:new Set()};
  const cards=isSort?l.items.map(i=>i.a):shuffle([...l.slots.map(s=>s.a),...(l.extra||[]).map(x=>x.a)]);
  const order=isSort?shuffle(cards):cards;
  const errEl=el("span",{class:"err"});
  app.querySelector(".top .tt small").append(NST>1?tr(" · Etap {0}/{1} · ",stage+1,NST):" · ",errEl);
  const body=el("div",{class:"lvl"});
  const tray=el("div",{class:"tray"});
  app.append(body,tray);
  const toast=el("div",{class:"toast",role:"status"});
  const inSlots=()=>new Set(S.place.filter(x=>x!=null&&typeof x==="string"));
  function poolCards(){if(isSort)return order.filter(c=>S.place[l.items.findIndex(i=>i.a===c)]==null);const used=inSlots();return order.filter(c=>!used.has(c))}
  function msg(t){toast.textContent=tr(t)}
  function tapCard(c){if(S.done)return;S.sel=S.sel===c?null:c;render()}
  function tapSlot(i){
    if(S.done||S.locked.has(i))return;S.wrong.delete(i);
    if(S.sel!=null){S.place.forEach((v,k)=>{if(v===S.sel)S.place[k]=null});S.place[i]=S.sel;S.sel=null}
    else if(S.place[i]!=null){S.place[i]=null}
    else{msg("Najpierw wybierz kartę z szuflady na dole.")}
    render();
  }
  function tapBin(b){if(S.done)return;if(S.sel==null){msg("Najpierw wybierz kartę z szuflady na dole.");return}const idx=l.items.findIndex(i=>i.a===S.sel);S.place[idx]=b;S.wrong.delete(idx);S.sel=null;render()}
  function unBin(idx){if(S.done||S.locked.has(idx))return;S.place[idx]=null;S.wrong.delete(idx);render()}
  // --- drzewo: liczy się rodzic i kształt poddrzewa, nie kolejność rodzeństwa ---
  const T=l.tree;
  const idxOfN=n=>l.slots.findIndex(s=>s.n===n);
  const par=i=>{const p=T[l.slots[i].n];return p?idxOfN(p):-1};
  const kids=i=>l.slots.map((s,k)=>k).filter(k=>par(k)===i);
  const sig=i=>"("+kids(i).map(sig).sort().join("")+")";
  const canon=v=>l.slots.findIndex(s=>s.a===v);
  function treeJudge(i,v){
    const j=canon(v);if(j<0)return"bad";
    const pi=par(i),pj=par(j);
    if((pi<0)!==(pj<0))return"bad";
    if(sig(j)!==sig(i))return"bad";
    if(pi<0)return"ok";
    if(!S.locked.has(pi))return"wait";
    return S.place[pi]===l.slots[pj].a?"ok":"bad";
  }
  function treeWhy(i,v){
    const ex=(l.extra||[]).find(x=>x.a===v);if(ex)return tr("„{0}”: {1}",tr(v),tr(ex.e));
    const j=canon(v),pi=par(i),pj=par(j);
    if(pi<0&&pj>=0)return tr("„{0}” nie jest główną gałęzią: należy do „{1}”.",tr(v),tr(l.slots[pj].a));
    if(pi>=0&&pj<0)return tr("„{0}” to główna gałąź, powinna być na samej górze.",tr(v));
    if(sig(j)!==sig(i)){const ki=kids(i).length,kj=kids(j).length;return ki&&!kj?tr("To pole dzieli się dalej, a „{0}” nie ma odgałęzień.",tr(v)):!ki&&kj?tr("„{0}” dzieli się dalej, a to pole nie ma odgałęzień.",tr(v)):tr("„{0}” rozgałęzia się inaczej niż to miejsce: policz poziomy pod spodem.",tr(v))}
    return tr("„{0}” nie jest częścią „{1}”, tylko „{2}”.",tr(v),tr(S.place[pi]),tr(l.slots[pj].a));
  }
  const depth=i=>par(i)<0?0:1+depth(par(i));
  function why(i,v){ // wyjaśnienie błędu
    if(T)return treeWhy(i,v);
    if(isSort){const it=l.items[i];return tr("„{0}” należy do: {1}.",tr(it.a),tr(l.bins[it.b]))}
    const ex=(l.extra||[]).find(x=>x.a===v);if(ex)return tr("„{0}”: {1}",tr(v),tr(ex.e));
    const s=l.slots.find(s=>s.a===v);if(s&&l.kind==="seq"){const pos=l.slots.indexOf(s)+1;return tr(pos<i+1?"„{0}” to krok {1} (wcześniej).":"„{0}” to krok {1} (później).",tr(v),pos)}
    if(s&&s.q)return tr("„{0}” pasuje do: {1}",tr(v),tr(s.q));
    if(s&&s.n)return tr("„{0}” to element nr {1}.",tr(v),s.n);return "";
  }
  function check(){
    let placed=0,bad=0;const whys=[];
    let waiting=0;
    const ordr=S.place.map((v,i)=>i);if(T)ordr.sort((a,b)=>depth(a)-depth(b));
    ordr.forEach(i=>{const v=S.place[i];if(v==null||S.locked.has(i))return;placed++;
      const r=T?treeJudge(i,v):(isSort?l.items[i].b===v:l.slots[i].a===v)?"ok":"bad";
      if(r==="ok")S.locked.add(i);else if(r==="wait")waiting++;else{bad++;S.wrong.add(i);whys.push(why(i,isSort?l.items[i].a:v))}});
    if(!placed){msg("Nic nowego do sprawdzenia. Wstaw kilka kart.");return}
    S.mistakes+=bad;const total=isSort?l.items.length:l.slots.length;
    if(S.locked.size===total){finish();return}
    toast.innerHTML="";
    if(bad){toast.append(el("b",null,tr("Błędne: {0}. ",bad)),...whys.slice(0,2).map(w=>el("div",{class:"why"},"✕ "+w)))}else toast.textContent=tr("Dobrze! Zostało {0}.",total-S.locked.size);
    if(waiting)toast.append(el("div",{class:"why",style:"color:var(--muted)"},tr("Kart czekających: {0}. Najpierw poprawnie uzupełnij pole wyżej w drzewie.",waiting)));
    render();
    if(bad)later(()=>{S.wrong.forEach(i=>{S.place[i]=null});S.wrong.clear();render()},1100);
  }
  function hint(){
    if(S.done)return;const total=isSort?l.items.length:l.slots.length;
    if(T){
      const cand=S.place.map((v,i)=>i).filter(i=>!S.locked.has(i)&&(par(i)<0||S.locked.has(par(i)))).sort((a,b)=>depth(a)-depth(b));
      const usedL=new Set([...S.locked].map(k=>S.place[k]));
      for(const i of cand){const v=l.slots.map(s=>s.a).find(a=>!usedL.has(a)&&treeJudge(i,a)==="ok");if(!v)continue;
        S.place.forEach((x,k)=>{if(x===v&&!S.locked.has(k))S.place[k]=null});S.place[i]=v;S.locked.add(i);S.wrong.delete(i);S.mistakes++;S.sel=null;msg("Podpowiedź wstawiona (liczy się jak jeden błąd).");
        if(S.locked.size===total){finish();return}render();return}
      return;
    }
    for(let i=0;i<total;i++){if(S.locked.has(i))continue;
      if(isSort){S.place[i]=l.items[i].b}else{const a=l.slots[i].a;S.place.forEach((v,k)=>{if(v===a)S.place[k]=null});S.place[i]=a}
      S.locked.add(i);S.wrong.delete(i);S.mistakes++;S.sel=null;msg("Podpowiedź wstawiona (liczy się jak jeden błąd).");
      if(S.locked.size===total){finish();return}render();return}
  }
  function finish(){
    S.done=true;
    if(stage+1<NST){render();body.prepend(el("div",{class:"win"},el("h2",null,"Etap 1 z 2 ukończony ✓"),el("p",{class:"intro",style:"margin:6px 0 0"},"Teraz to, co najważniejsze: za co odpowiada każdy obszar."),el("div",{class:"row"},el("button",{class:"btn pri",onclick:()=>openLevel(l0,"q",stage+1,S.mistakes)},"Etap 2: funkcje →"))));tray.hidden=true;window.scrollTo({top:0});return}
    const st=starsFor(S.mistakes);if(st>(best[l.id]||0)){best[l.id]=st;save()}
    render();
    const i=LEVELS.indexOf(l0),next=LEVELS[i+1];
    const box=el("div",{class:"win"},
      el("div",{class:"big"},"★".repeat(st)+"☆".repeat(3-st)),
      el("h2",null,S.mistakes?tr("Ukończone. Błędy: {0}.",S.mistakes):"Bezbłędnie!"),
      el("p",{class:"intro",style:"margin:6px 0 0"},S.mistakes?"Wróć do „Odkrywaj”, pobaw się modelem i spróbuj jeszcze raz po 3 gwiazdki.":"Wszystkie pola zielone: dotknij dowolnego, żeby przypomnieć sobie szczegóły."),
      el("div",{class:"row"},
        el("button",{class:"btn",onclick:()=>openLevel(l0,"q")},"Jeszcze raz"),
        el("button",{class:"btn",onclick:()=>openLevel(l0,"x")},"Odkrywaj"),
        next?el("button",{class:"btn pri",onclick:()=>{location.hash=next.id}},tr("Dalej: {0}",tr(next.title))):el("button",{class:"btn pri",onclick:()=>{location.hash=""}},"Menu")));
    body.prepend(box);tray.hidden=true;window.scrollTo({top:0});
  }
  function render(){
    errEl.textContent=tr("Błędy: {0}",S.mistakes);
    body.querySelectorAll(":scope > :not(.win)").forEach(n=>n.remove());
    body.append(el("p",{class:"intro"},l.intro));
    if(l.svg){const f=el("div",{class:"fig",html:l.svg});f.querySelectorAll(".mk").forEach(g=>{const n=+g.dataset.n;const i=l.slots.findIndex(s=>s.n===n);if(S.locked.has(i))g.classList.add("done")});body.append(f)}
    if(isSort){
      const bins=el("div",{class:"bins c"+l.bins.length});
      l.bins.forEach((b,bi)=>{
        const bin=el("div",{class:"bin"+(S.sel!=null?" target":""),role:"button",tabindex:"0",onclick:()=>tapBin(bi),onkeydown:e=>{if(e.key==="Enter")tapBin(bi)}},el("h3",null,b));
        l.items.forEach((it,idx)=>{if(S.place[idx]===bi){bin.append(el("button",{class:"card"+(S.locked.has(idx)?" ok":"")+(S.wrong.has(idx)?" wrong":""),onclick:e=>{e.stopPropagation();if(S.locked.has(idx))msg(tr(it.a)+": "+tr(it.e));else unBin(idx)}},it.a))}});
        bins.append(bin)});
      body.append(bins);
    }else{
      const wrap=el("div",{class:"slots"});
      l.slots.forEach((s,i)=>{
        const lk=S.locked.has(i),v=S.place[i];
        const q=s.q&&l.kind==="diagram"?s.q:l.kind==="diagram"?tr("Element nr {0}",s.n):l.kind==="seq"?tr("Krok {0}",i+1):s.q;
        wrap.append(el("div",{class:"slot"+(lk?" ok":"")+(S.wrong.has(i)?" wrong":"")+(S.sel!=null&&!lk?" target":""),role:"button",tabindex:"0",onclick:()=>tapSlot(i),onkeydown:e=>{if(e.key==="Enter")tapSlot(i)}},
          el("span",{class:"n"},l.kind==="diagram"?s.n:i+1),el("div",{class:"q"},q),
          el("div",{class:"drop"+(v?" filled":"")},v||"Dotknij, aby wstawić wybraną kartę"),
          lk?el("div",{class:"exp"},(l.slots.find(x=>x.a===v)||s).e):null));
        if((l.kind==="seq"||l.kind==="chain")&&i<l.slots.length-1)wrap.append(el("div",{class:"arrow","aria-hidden":"true"},"↓"));
      });
      body.append(wrap);
    }
    body.append(el("div",{style:"height:8px"}));
    tray.innerHTML="";const pc=poolCards();
    tray.append(el("div",{class:"tray-in"},
      el("div",{class:"hint"},pc.length?(S.sel?"Teraz dotknij pola, do którego pasuje karta.":"Wybierz kartę, potem dotknij pola. Dotknięcie wypełnionego pola zabiera kartę."):"Wszystkie karty rozłożone. Sprawdź!"),
      pc.length?el("div",{class:"pool"},pc.map(c=>el("button",{class:"card"+(S.sel===c?" sel":""),"aria-pressed":S.sel===c?"true":"false",onclick:()=>tapCard(c)},c))):null,
      el("div",{class:"actions"},el("button",{class:"btn",onclick:hint},"Podpowiedź"),el("button",{class:"btn pri",onclick:check},"Sprawdź")),
      toast));
  }
  render();
}

function route(){
  if(!LANG){picker();return}
  document.documentElement.lang=LANG==="uk"?"uk":"pl";document.title=LANG==="uk"?"Нейроскладанка":"Neuroukładanka";
  const id=location.hash.slice(1);const l=LEVELS.find(x=>x.id===id);
  if(l)openLevel(l,"x");else home();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
