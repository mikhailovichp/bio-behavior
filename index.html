<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuroukładanka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Paleta inspirowana barwieniem histologicznym H&E: hematoksylina (fiolet) i eozyna (róż).
   Układ: lista modułów → plansza poziomu z szufladą kart przyklejoną do dołu ekranu. */
:root{
  --bg:#f6f4f8;
  --surface:#ffffff;
  --ink:#231d33;
  --muted:#6c6580;
  --line:#ddd7e6;
  --hema:#4b3a8c;
  --eosin:#d4507a;
  --hema-soft:#ebe6f6;
  --good:#1f8a5b;
  --good-soft:#e2f4ea;
  --bad:#c23a3a;
  --bad-soft:#fbe5e5;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16131f; --surface:#211c2e; --ink:#eeeaf6; --muted:#a59db8; --line:#3a3349;
    --hema:#a996f0; --eosin:#f07aa0; --hema-soft:#2d2642;
    --good:#4fcb8d; --good-soft:#173528; --bad:#f07b7b; --bad-soft:#3d1d22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16131f; --surface:#211c2e; --ink:#eeeaf6; --muted:#a59db8; --line:#3a3349;
  --hema:#a996f0; --eosin:#f07aa0; --hema-soft:#2d2642;
  --good:#4fcb8d; --good-soft:#173528; --bad:#f07b7b; --bad-soft:#3d1d22;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:1.15rem;font-weight:800}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch}
.prog{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hema),var(--eosin))}
.prog b{font-variant-numeric:tabular-nums;font-size:.9rem}
.module{margin-top:26px;display:grid;gap:10px}
.module header{display:flex;align-items:baseline;gap:10px}
.module header span{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tile{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tile:hover{border-color:var(--hema)}
.tile .t{font-weight:600}
.tile .meta{font-size:.78rem;color:var(--muted);grid-column:1}
.tile .st{grid-row:1/3;grid-column:2;font-size:1.05rem;letter-spacing:2px;color:var(--line)}
.tile .st .on{color:var(--eosin)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--hema-soft);color:var(--hema);font-weight:600;font-size:.72rem;margin-right:6px}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--hema);text-decoration:underline;cursor:pointer;font-size:.8rem}

/* Poziom */
.top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600}
.top .tt{flex:1;min-width:0}
.top .tt h2{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{color:var(--muted);font-size:.75rem}
.err{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted);white-space:nowrap}
.lvl{max-width:760px;margin:0 auto;padding:14px 16px 0}
.intro{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:12px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:300px}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.slot .n{min-width:28px;height:28px;border-radius:99px;display:grid;place-items:center;background:var(--hema);color:var(--surface);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.slot .q{font-size:.92rem}
.slot .drop{grid-column:1/-1;min-height:42px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;padding:6px 10px;color:var(--muted);font-size:.88rem}
.slot.target .drop{border-color:var(--eosin);background:color-mix(in srgb,var(--eosin) 8%,transparent)}
.slot .drop.filled{border-style:solid;border-color:var(--hema);color:var(--ink);font-weight:600;background:var(--hema-soft)}
.slot.ok{border-color:var(--good)}
.slot.ok .drop{border-color:var(--good);background:var(--good-soft)}
.slot.ok .n{background:var(--good)}
.slot.wrong .drop{border-color:var(--bad);background:var(--bad-soft)}
.slot .exp{grid-column:1/-1;font-size:.85rem;color:var(--muted);border-left:3px solid var(--good);padding-left:9px}
.arrow{text-align:center;color:var(--muted);font-size:1rem;line-height:1;margin:-2px 0}
.bins{display:grid;gap:10px}
@media (min-width:560px){.bins.c2{grid-template-columns:1fr 1fr}.bins.c3{grid-template-columns:1fr 1fr 1fr}}
.bin{border-radius:14px;border:2px dashed var(--line);background:var(--surface);padding:10px;min-height:96px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.bin.target{border-color:var(--eosin)}
.bin h3{font-size:.95rem;color:var(--hema)}
.bin .card{width:100%}

.tray{position:sticky;bottom:0;z-index:6;margin-top:14px;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.tray-in{max-width:760px;margin:0 auto}
.tray .hint{font-size:.78rem;color:var(--muted);margin-bottom:6px}
.pool{display:flex;flex-wrap:wrap;gap:6px;max-height:30vh;overflow-y:auto;padding:2px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:.88rem;text-align:left;box-shadow:0 1px 0 var(--line)}
.card.sel{border-color:var(--eosin);background:var(--eosin);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--eosin) 30%,transparent)}
.card.ok{border-color:var(--good);background:var(--good-soft);cursor:default}
.card.wrong{border-color:var(--bad);background:var(--bad-soft)}
.actions{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.btn.pri{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.toast{font-size:.85rem;margin-top:6px;min-height:1.2em;color:var(--muted)}
.win{background:var(--surface);border:1px solid var(--good);border-radius:14px;padding:16px;margin:14px 0}
.win .big{font-size:1.6rem;letter-spacing:4px;color:var(--eosin)}
.win ol{padding-left:20px;margin:10px 0 0;display:grid;gap:8px;font-size:.88rem}
.win ol b{color:var(--ink)}
.win ol span{color:var(--muted)}
.win .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sv-o{fill:var(--hema-soft);stroke:var(--hema);stroke-width:2}
.sv-l{fill:none;stroke:var(--hema);stroke-width:2;stroke-linecap:round}
.sv-d{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.sv-f{fill:var(--hema)}
.sv-m{fill:var(--eosin)}
.sv-t{fill:var(--muted);font:11px var(--body)}
.mk circle{fill:var(--surface);stroke:var(--eosin);stroke-width:2}
.mk text{fill:var(--ink);font:700 12px var(--body);text-anchor:middle;dominant-baseline:central}
.mk.done circle{fill:var(--good);stroke:var(--good)}
.mk.done text{fill:var(--surface)}
.lead{stroke:var(--eosin);stroke-width:1.2}
@media (prefers-reduced-motion:no-preference){.card,.slot,.bin{transition:background .15s,border-color .15s}}

.top{flex-wrap:wrap}
.tabs{flex-basis:100%;display:flex;gap:6px}
.tabb{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabb.on{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.tag.alt{background:color-mix(in srgb,var(--eosin) 14%,transparent);color:var(--eosin)}
.explore{padding-bottom:24px}
.cv{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.simrow{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px}
.lbl{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.bigv{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--eosin)}
.ctrl{display:grid;gap:4px;margin:10px 0;font-size:.9rem}
.ctrl.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrl.inline .btn{flex:0 1 auto}
.ctrl input[type=range]{width:100%;accent-color:var(--eosin)}
.spread{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.chk{display:flex;gap:6px;align-items:center;font-size:.88rem;cursor:pointer}
.chk input{accent-color:var(--eosin);width:18px;height:18px}
.try{font-size:.85rem;color:var(--muted);margin:10px 0}
.try::before{content:"Spróbuj → ";font-weight:700;color:var(--hema)}
html[lang="uk"] .try::before{content:"Спробуй → "}
.readout{font-size:.88rem;min-height:1.6em;margin:6px 0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--hema-soft);color:var(--hema);font-weight:600;font-size:.8rem}
.pill.hot{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--eosin);border-color:var(--eosin);color:#fff}
.infocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:64px}
.infocard h3{font-size:1rem;margin-bottom:4px}
.tagc{display:inline-block;border-radius:8px;padding:4px 9px;font-size:.85rem;background:var(--good-soft);color:var(--ink)}
.tagc.bad{background:var(--bad-soft)}
.exp2{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.organs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.organ{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;display:grid;gap:2px}
.organ b{font-size:.8rem}.organ small{font-size:.72rem;color:var(--muted)}
.organ .cv{border:0;margin:0}
.brain .rg{fill:transparent;cursor:pointer;stroke:transparent}
.brain polygon.rg:hover,.brain ellipse.rg:hover,.brain path.rg:not(.strip):hover{fill:color-mix(in srgb,var(--hema) 12%,transparent)}
.brain .rg.act{fill:color-mix(in srgb,var(--eosin) 45%,transparent)}
.brain.lesion .rg.act{fill:color-mix(in srgb,var(--bad) 55%,transparent)}
.brain .strip{fill:none;stroke-width:14;pointer-events:stroke;stroke:color-mix(in srgb,var(--hema) 10%,transparent)}
.brain .strip.act{fill:none;stroke:var(--eosin)}
.brain.lesion .strip.act{stroke:var(--bad)}
.brain .dot{fill:color-mix(in srgb,var(--hema) 25%,transparent);stroke:var(--hema);stroke-dasharray:3 3}
.brain ellipse.rg,.brain path.rg:not(.strip){fill:var(--hema-soft);stroke:var(--hema);stroke-width:2}
.brain ellipse.rg.act,.brain path.rg.act:not(.strip){fill:var(--eosin)}
.brain.lesion ellipse.rg.act,.brain.lesion path.rg.act:not(.strip){fill:var(--bad)}
.flow{display:block;width:100%;height:auto}
.flow .edge{fill:none;stroke:var(--line);stroke-width:2}
.flow .edge.hot{stroke:var(--hema)}
.flow .edge.inhib{stroke-dasharray:5 4}
.flow .edge.inhib.hot{stroke:var(--bad)}
.flow .elab{fill:var(--muted);font:600 10px var(--body)}
.flow .node rect{fill:var(--surface);stroke:var(--hema);stroke-width:1.5}
.flow .node text{fill:var(--ink);font:600 11px var(--body);text-anchor:middle;dominant-baseline:central}
.flow .node.src rect{stroke-dasharray:4 3;fill:var(--bg)}
.flow .node.on rect{fill:var(--eosin);stroke:var(--eosin)}
.flow .node.on text{fill:#fff}
.flow .node.dim{opacity:.45}
.flow .node.hurt rect{stroke:var(--bad);stroke-dasharray:3 3;fill:var(--bad-soft)}
.flow .node.hurt text{fill:var(--bad)}
.pulse{fill:var(--eosin);stroke:var(--surface);stroke-width:2}
.pulse.inh{fill:var(--bad)}
.fig{position:relative}
.clock{position:absolute;right:12px;top:10px;font:700 .85rem var(--display);color:var(--eosin)}
.meters{display:grid;gap:6px;margin:8px 0}
.meter{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-size:.82rem;font-weight:600}
.mbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--eosin)}
.mg{cursor:pointer}
.mrect.a{fill:color-mix(in srgb,var(--hema) 22%,transparent);stroke:var(--hema)}
.mrect.s{fill:color-mix(in srgb,var(--bad) 18%,transparent);stroke:var(--bad)}
.mg.act .mrect{fill:var(--eosin);stroke:var(--eosin)}
.mg.act .mlab{fill:#fff}
.mlab{fill:var(--ink);font:700 10px var(--body)}
.svtag rect{fill:var(--ink)}.svtag text{fill:var(--surface);font:600 11px var(--body)}
.revs{display:grid;gap:8px}
.rev{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.rev .rq{font-size:.92rem}
.rev .ra{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.rev.open{border-color:var(--good);cursor:default}
.rev.open .ra{border-top-style:solid;border-color:var(--good)}
.rev.open .ra b{color:var(--good)}
.gonext{margin-top:18px;display:flex}
.why{font-size:.82rem;color:var(--bad);margin-top:2px}
@media (prefers-reduced-motion:no-preference){
 .pop{animation:pop .35s ease}
 @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
 .pulse-a{animation:pa 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes pa{50%{transform:scale(1.5)}}
 .climb{animation:cl 3s linear infinite}
 @keyframes cl{from{transform:translateY(120px)}to{transform:translateY(-10px)}}
}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lsw{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.lchip{border:0;background:var(--surface);padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--muted)}
.lchip.on{background:var(--hema);color:var(--surface)}
.picker{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.langs{display:grid;gap:12px;margin-top:24px}
.langb{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 18px;cursor:pointer}
.langb:hover{border-color:var(--hema)}
.langb b{font-family:var(--display);font-size:1.35rem}
.langb span{color:var(--muted);font-size:.9rem}
.scene{margin-top:8px}
.facts-h{font-size:1.05rem;margin:26px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.rev .rexp{display:block;margin-top:3px;color:var(--ink);line-height:1.45}
.rev.trap{border-style:dashed}
.scn-t{font-size:1rem;margin:0 0 6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- Języki ---------- */
let LANG=(()=>{try{const v=localStorage.getItem("neuro-lang");return v==="pl"||v==="uk"?v:null}catch(e){return null}})();
const UA={"Organizacja układu nerwowego": "Організація нервової системи", "Schemat układu nerwowego": "Схема нервової системи", "Wstaw nazwy w pola drzewa podziału układu nerwowego. Kolejność gałęzi na tym samym poziomie nie ma znaczenia: liczy się, co z czego się wywodzi.": "Впиши назви в поля дерева поділу нервової системи. Порядок гілок на одному рівні не важливий: має значення, що з чого походить.", "Ośrodkowy układ nerwowy (OUN)": "Центральна нервова система (ЦНС)", "Mózgowie i rdzeń kręgowy, chronione przez czaszkę, kręgosłup i opony.": "Головний і спинний мозок, захищені черепом, хребтом і мозковими оболонками.", "Obwodowy układ nerwowy": "Периферична нервова система", "Nerwy czaszkowe i rdzeniowe oraz zwoje leżące poza OUN.": "Черепні та спинномозкові нерви, а також ганглії поза ЦНС.", "Mózgowie": "Головний мозок", "Przodomózgowie, śródmózgowie i tyłomózgowie.": "Передній, середній і задній мозок.", "Rdzeń kręgowy": "Спинний мозок", "Przewodzi informacje między mózgowiem a ciałem i realizuje odruchy. Istota szara w środku (kształt motyla), biała na zewnątrz.": "Передає інформацію між головним мозком і тілом та здійснює рефлекси. Сіра речовина всередині (у формі метелика), біла ззовні.", "Układ somatyczny": "Соматична нервова система", "Nerwy czuciowe ze skóry, mięśni i stawów oraz ruchowe do mięśni szkieletowych: ruchy zależne od woli.": "Чутливі нерви від шкіри, м'язів і суглобів та рухові до скелетних м'язів: довільні рухи.", "Układ autonomiczny": "Автономна (вегетативна) нервова система", "Steruje sercem, jelitami i gruczołami, w dużej mierze bez udziału woli.": "Керує серцем, кишківником і залозами, здебільшого без участі волі.", "Część współczulna": "Симпатичний відділ", "„Walcz lub uciekaj”. Włókna wychodzą z piersiowego i lędźwiowego odcinka rdzenia.": "«Бий або тікай». Волокна виходять із грудного й поперекового відділів спинного мозку.", "Część przywspółczulna": "Парасимпатичний відділ", "„Odpoczywaj i traw”. Włókna biegną w nerwach czaszkowych (m.in. błędnym) i z krzyżowego odcinka rdzenia.": "«Відпочивай і перетравлюй». Волокна йдуть у черепних нервах (зокрема блукаючому) і з крижового відділу спинного мозку.", "Układ limbiczny": "Лімбічна система", "To zespół struktur wewnątrz mózgowia związanych z emocjami, a nie gałąź podziału anatomicznego.": "Це комплекс структур усередині головного мозку, пов'язаних з емоціями, а не гілка анатомічного поділу.", "Współczulny czy przywspółczulny?": "Симпатична чи парасимпатична?", "Przypisz każdą reakcję do właściwej części układu autonomicznego.": "Віднеси кожну реакцію до правильного відділу автономної нервової системи.", "Współczulny": "Симпатичний", "Przywspółczulny": "Парасимпатичний", "Rozszerzenie źrenic": "Розширення зіниць", "Więcej światła trafia do oka w sytuacji zagrożenia.": "Більше світла потрапляє в око в ситуації загрози.", "Przyspieszenie akcji serca": "Прискорення серцебиття", "Więcej krwi dla mięśni przy wysiłku i stresie.": "Більше крові для м'язів під час зусилля і стресу.", "Rozszerzenie oskrzeli": "Розширення бронхів", "Ułatwia pobieranie tlenu.": "Полегшує надходження кисню.", "Hamowanie trawienia": "Гальмування травлення", "Energia trafia do mięśni zamiast do jelit.": "Енергія йде до м'язів замість кишківника.", "Uwalnianie glukozy z wątroby": "Вивільнення глюкози з печінки", "Szybkie paliwo dla mięśni i mózgu.": "Швидке пальне для м'язів і мозку.", "Pobudzenie rdzenia nadnerczy": "Стимуляція мозкової речовини надниркових залоз", "Rdzeń nadnerczy to środek gruczołu leżącego na nerce. Pobudzony przez nerwy współczulne wyrzuca do krwi adrenalinę, która wzmacnia reakcję „walcz lub uciekaj” w całym ciele.": "Мозкова речовина надниркових залоз — це середина залози, що лежить на нирці. Збуджена симпатичними нервами, вона викидає в кров адреналін, який посилює реакцію «бий або тікай» у всьому тілі.", "Zwężenie źrenic": "Звуження зіниць", "Typowe dla stanu spoczynku.": "Типово для стану спокою.", "Zwolnienie akcji serca": "Сповільнення серцебиття", "Głównie przez nerw błędny.": "Головно через блукаючий нерв.", "Wydzielanie śliny i soków trawiennych": "Виділення слини й травних соків", "„Odpoczywaj i traw”.": "«Відпочивай і перетравлюй».", "Nasilenie perystaltyki jelit": "Посилення перистальтики кишківника", "Przesuwanie treści pokarmowej.": "Просування харчової маси.", "Nerw błędny (X)": "Блукаючий нерв (X)", "Dziesiąty nerw czaszkowy: „błądzi” od pnia mózgu aż do brzucha. To główna droga części przywspółczulnej: zwalnia serce i pobudza trawienie.": "Десятий черепний нерв: «блукає» від стовбура мозку аж до живота. Це головний шлях парасимпатичного відділу: сповільнює серце і стимулює травлення.", "Przekaźnik zazwojowy: acetylocholina": "Медіатор постгангліонарного нейрона: ацетилхолін", "Neuron zazwojowy to ostatni neuron w łańcuchu, ten za zwojem, który dochodzi do narządu. W części przywspółczulnej uwalnia acetylocholinę, a w współczulnej zwykle noradrenalinę.": "Постгангліонарний нейрон — останній нейрон у ланцюжку, той, що за гангліем і доходить до органа. У парасимпатичному відділі він виділяє ацетилхолін, а в симпатичному зазвичай норадреналін.", "Płaty mózgu i ich funkcje": "Частки мозку та їхні функції", "Mózg w widoku bocznym, przód po lewej. Nazwij oznaczone struktury.": "Мозок збоку, перед ліворуч. Назви позначені структури.", "Płat czołowy": "Лобова частка", "Kora ruchowa (zakręt przedśrodkowy) i przedczołowa: planowanie, funkcje wykonawcze, kontrola impulsów. W lewej półkuli ośrodek Broki.": "Рухова кора (передцентральна звивина) і префронтальна кора: планування, виконавчі функції, контроль імпульсів. У лівій півкулі — центр Брока.", "Płat ciemieniowy": "Тім'яна частка", "Kora somatosensoryczna (zakręt zaśrodkowy), orientacja i uwaga przestrzenna.": "Соматосенсорна кора (постцентральна звивина), орієнтація та увага в просторі.", "Płat skroniowy": "Скронева частка", "Kora słuchowa, rozumienie mowy (Wernicke), rozpoznawanie twarzy i obiektów. Przyśrodkowo: hipokamp i ciało migdałowate.": "Слухова кора, розуміння мовлення (Верніке), розпізнавання облич і предметів. Медіально: гіпокамп і мигдалеподібне тіло.", "Płat potyliczny": "Потилична частка", "Pierwszorzędowa kora wzrokowa (V1). Obustronne uszkodzenie daje ślepotę korową.": "Первинна зорова кора (V1). Двобічне ураження дає кіркову сліпоту.", "Móżdżek": "Мозочок", "Koordynacja i precyzja ruchów, równowaga, odmierzanie czasu, uczenie ruchowe.": "Координація і точність рухів, рівновага, відлік часу, рухове навчання.", "Pień mózgu": "Стовбур мозку", "Rdzeń przedłużony, most i śródmózgowie: oddychanie, praca serca, czuwanie (twór siatkowaty), jądra nerwów czaszkowych.": "Довгастий мозок, міст і середній мозок: дихання, робота серця, бадьорість (ретикулярна формація), ядра черепних нервів.", "Wyspa": "Острівець", "Kora wyspy leży w głębi bruzdy bocznej i nie jest widoczna z boku. Odpowiada m.in. za interocepcję i smak.": "Кора острівця лежить у глибині бічної борозни і збоку не видна. Відповідає, зокрема, за інтероцепцію і смак.", "Etap 2: za co odpowiada każdy obszar? Przypisz funkcję do miejsca na mózgu.": "Етап 2: за що відповідає кожна ділянка? Признач функцію місцю на мозку.", "🗼 Planowanie i kontrola impulsów": "🗼 Планування і контроль імпульсів", "Kora przedczołowa: funkcje wykonawcze. Uszkodzenie: impulsywność, perseweracje (Phineas Gage).": "Префронтальна кора: виконавчі функції. Ураження: імпульсивність, персеверації (Фінеас Гейдж).", "🧭 Uwaga i orientacja w przestrzeni": "🧭 Увага й орієнтація в просторі", "Uszkodzenie prawego płata: zaniedbywanie lewej strony (zegar narysowany z jednej strony).": "Ураження правої частки: ігнорування лівого боку (годинник, намальований з одного боку).", "👂 Słuch i rozpoznawanie twarzy": "👂 Слух і розпізнавання облич", "Kora słuchowa i zakręt wrzecionowaty. Uszkodzenie: prozopagnozja.": "Слухова кора та веретеноподібна звивина. Ураження: прозопагнозія.", "👁 Widzenie": "👁 Зір", "Kora wzrokowa V1. Uszkodzenie: ślepota korowa przy zdrowych oczach.": "Зорова кора V1. Ураження: кіркова сліпота при здорових очах.", "🎯 Koordynacja i równowaga": "🎯 Координація і рівновага", "Uszkodzenie: ataksja, drżenie zamiarowe.": "Ураження: атаксія, інтенційний тремор.", "🫁 Oddech, tętno, czuwanie": "🫁 Дихання, пульс, бадьорість", "Ośrodek Broki": "Центр Брока", "🗣 Mówienie": "🗣 Мовлення", "Uszkodzenie: afazja ruchowa, mowa telegraficzna, rozumienie zachowane.": "Ураження: моторна афазія, телеграфне мовлення, розуміння збережене.", "Ośrodek Wernickego": "Центр Верніке", "💬 Rozumienie mowy": "💬 Розуміння мовлення", "Uszkodzenie: afazja czuciowa, płynna mowa bez sensu.": "Ураження: сенсорна афазія, плавне мовлення без сенсу.", "Kora ruchowa (zakręt przedśrodkowy)": "Рухова кора (передцентральна звивина)", "🏃 Ruchy dowolne": "🏃 Довільні рухи", "Steruje mięśniami przeciwnej strony ciała.": "Керує м'язами протилежного боку тіла.", "Kora czuciowa (zakręt zaśrodkowy)": "Чутлива кора (постцентральна звивина)", "✋ Czucie dotyku i bólu": "✋ Відчуття дотику і болю", "Odbiera czucie z przeciwnej strony ciała.": "Сприймає чутливість із протилежного боку тіла.", "🧪 Wydzielanie hormonów": "🧪 Виділення гормонів", "To podwzgórze, które leży w głębi mózgowia i nie jest widoczne z boku.": "Це гіпоталамус, що лежить у глибині мозку і збоку не видний.", "Struktura a funkcja": "Структура і функція", "Kora, móżdżek, jądra podstawne": "Кора, мозочок, базальні ганглії", "Rozłóż cechy i objawy do trzech struktur.": "Розклади ознаки й симптоми по трьох структурах.", "Kora mózgowa": "Кора великих півкуль", "Jądra podstawne": "Базальні ганглії", "Sześć warstw komórek (kora nowa)": "Шість шарів клітин (неокортекс)", "Kora nowa (ewolucyjnie najmłodsza, ok. 90% kory) ma sześć warstw neuronów, jedna nad drugą. Móżdżek i jądra podstawne mają inną budowę.": "Нова кора (еволюційно наймолодша, ~90% кори) має шість шарів нейронів, один над одним. Мозочок і базальні ганглії побудовані інакше.", "Planowanie i podejmowanie decyzji": "Планування і прийняття рішень", "Kora przedczołowa, czyli przednia część płata czołowego, układa plan, przewiduje skutki i hamuje impulsy.": "Префронтальна кора, тобто передня частина лобової частки, складає план, передбачає наслідки і гальмує імпульси.", "Świadoma percepcja i język": "Свідоме сприйняття і мова", "Świadomie widzimy i słyszymy dzięki korom czuciowym. Mowę tworzą i rozumieją ośrodki Broki i Wernickego, które też leżą w korze.": "Свідомо бачимо й чуємо завдяки сенсорним ділянкам кори. Мовлення творять і розуміють центри Брока і Верніке, які теж лежать у корі.", "Ataksja i drżenie zamiarowe po uszkodzeniu": "Атаксія та інтенційний тремор після ураження", "Ataksja to niezgrabne, źle skoordynowane ruchy. Drżenie zamiarowe: ręka drży tym mocniej, im bliżej celu. Oba objawy wskazują na móżdżek.": "Атаксія — незграбні, погано скоординовані рухи. Інтенційний тремор: рука тремтить тим сильніше, чим ближче до мети. Обидва симптоми вказують на мозочок.", "Precyzyjne odmierzanie czasu (timing)": "Точний відлік часу (таймінг)", "Móżdżek mierzy krótkie odstępy czasu: kiedy zatrzymać rękę, kiedy uderzyć w rytm. Osoby z jego uszkodzeniem gorzej stukają do rytmu.": "Мозочок вимірює короткі проміжки часу: коли зупинити руку, коли вдарити в ритм. Люди з його ураженням гірше відстукують ритм.", "Więcej neuronów niż cała reszta mózgowia": "Більше нейронів, ніж увесь решта мозку", "Móżdżek jest mały, ale ma ok. 80% wszystkich neuronów mózgu, głównie maleńkie komórki ziarniste.": "Мозочок малий, але містить ~80% усіх нейронів мозку, переважно крихітні зернисті клітини.", "Warunkowanie odruchu mrugania": "Умовний мигальний рефлекс", "Eksperyment: dźwięk, a tuż po nim dmuchnięcie w oko. Po kilku próbach mrugamy już na sam dźwięk. Tego wyuczonego mrugnięcia uczy się móżdżek (badania Thompsona).": "Експеримент: звук, а одразу за ним — подув в око. Після кількох спроб кліпаємо вже на сам звук. Цього вивченого кліпання вчиться мозочок (дослідження Томпсона).", "Prążkowie: jądro ogoniaste + skorupa": "Смугасте тіло: хвостате ядро + шкаралупа", "Jądra podstawne to skupiska neuronów głęboko pod korą. Ich główna część, prążkowie, składa się z jądra ogoniastego i skorupy.": "Базальні ганглії — скупчення нейронів глибоко під корою. Їхня головна частина, смугасте тіло, складається з хвостатого ядра і шкаралупи.", "Choroba Parkinsona": "Хвороба Паркінсона", "Giną neurony istoty czarnej, które dostarczają dopaminę do jąder podstawnych. Skutek: spowolnienie, sztywność, drżenie w spoczynku, trudność z rozpoczęciem ruchu.": "Гинуть нейрони чорної речовини, які постачають дофамін до базальних гангліїв. Наслідок: сповільненість, ригідність, тремор спокою, труднощі з початком руху.", "Pląsawica Huntingtona": "Хорея Гантінгтона", "Choroba dziedziczna, w której obumierają neurony prążkowia. Pojawiają się mimowolne, „tańczące” ruchy (pląsawica), później zaburzenia psychiczne i otępienie.": "Спадкова хвороба, за якої відмирають нейрони смугастого тіла. З'являються мимовільні, «танцювальні» рухи (хорея), пізніше психічні розлади і деменція.", "Wybór ruchu i tworzenie nawyków": "Вибір руху і формування звичок", "Jądra podstawne działają jak hamulec: przepuszczają tylko wybrany ruch, a resztę blokują. Przez powtarzanie utrwalają nawyki.": "Базальні ганглії працюють як гальмо: пропускають лише вибраний рух, а решту блокують. Через повторення закріплюють звички.", "Przypadki uszkodzeń mózgu": "Випадки ушкоджень мозку", "Dopasuj uszkodzoną strukturę do opisu przypadku.": "Зістав ушкоджену структуру з описом випадку.", "Phineas Gage: po przebiciu czaszki prętem stał się impulsywny i nieodpowiedzialny, choć intelekt pozostał.": "Фінеас Гейдж: після того як прут пробив йому череп, став імпульсивним і безвідповідальним, хоча інтелект зберігся.", "Kora przedczołowa": "Префронтальна кора", "Phineas Gage (1848): metalowy pręt przebił mu przednią część płata czołowego. Przeżył i myślał sprawnie, ale stał się impulsywny i nie umiał planować. Kora przedczołowa łączy emocje z decyzjami i hamuje impulsy.": "Фінеас Гейдж (1848): металевий прут пробив передню частину його лобової частки. Він вижив і мислив справно, але став імпульсивним і не вмів планувати. Префронтальна кора пов'язує емоції з рішеннями і гальмує імпульси.", "Pacjent H.M.: po obustronnej operacji przyśrodkowych płatów skroniowych nie tworzy nowych wspomnień o faktach i zdarzeniach.": "Пацієнт H.M.: після двобічної операції на медіальних скроневих частках не формує нових спогадів про факти й події.", "Hipokamp": "Гіпокамп", "H.M. (Henry Molaison) w 1953 r. miał usunięte obie przyśrodkowe części płatów skroniowych z hipokampami, żeby leczyć padaczkę. Pamiętał przeszłość, ale nie zapamiętywał nowych faktów i zdarzeń (amnezja następcza). Nowych umiejętności ruchowych uczył się nadal.": "H.M. (Генрі Молейсон) у 1953 р. переніс видалення обох медіальних частин скроневих часток разом із гіпокампами, щоб лікувати епілепсію. Пам'ятав минуле, але не запам'ятовував нових фактів і подій (антероградна амнезія). Нових рухових навичок навчався й далі.", "Mówi z trudem i telegraficznie, ale dobrze rozumie mowę.": "Говорить важко й телеграфно, але добре розуміє мовлення.", "Ośrodek Broki leży w lewym płacie czołowym. Gdy jest uszkodzony, chory wie, co chce powiedzieć, ale mówi z trudem, krótko, bez małych słów gramatycznych (mowa telegraficzna). Rozumie dobrze. To afazja ruchowa.": "Центр Брока лежить у лівій лобовій частці. Коли він уражений, хворий знає, що хоче сказати, але говорить важко, коротко, без маленьких граматичних слів (телеграфне мовлення). Розуміє добре. Це моторна афазія.", "Mówi płynnie, lecz bez sensu i słabo rozumie, co się do niego mówi.": "Говорить плавно, але беззмістовно і погано розуміє, що йому кажуть.", "Ośrodek Wernickego leży w lewym płacie skroniowym, przy korze słuchowej. Uszkodzenie: chory nie rozumie słów, a sam mówi płynnie, lecz bez sensu, często wymyślonymi słowami. To afazja czuciowa.": "Центр Верніке лежить у лівій скроневій частці, біля слухової кори. Ураження: хворий не розуміє слів, а сам говорить плавно, але без сенсу, часто вигаданими словами. Це сенсорна афазія.", "Pacjentka S.M. (choroba Urbacha-Wiethego) nie odczuwa strachu i nie rozpoznaje go na twarzach.": "Пацієнтка S.M. (хвороба Урбаха-Віте) не відчуває страху і не розпізнає його на обличчях.", "Ciało migdałowate": "Мигдалеподібне тіло", "Ciało migdałowate to struktura w kształcie migdała w głębi płata skroniowego, która ocenia zagrożenie. U pacjentki S.M. rzadka choroba genetyczna (choroba Urbacha-Wiethego) zwapniła oba ciała migdałowate, więc S.M. nie czuje strachu.": "Мигдалеподібне тіло (амигдала) — структура у формі мигдалю в глибині скроневої частки, яка оцінює загрозу. У пацієнтки S.M. рідкісна генетична хвороба (хвороба Урбаха-Віте) звапнила обидва мигдалеподібні тіла, тому S.M. не відчуває страху.", "Ignoruje lewą stronę przestrzeni: je tylko z prawej połowy talerza.": "Ігнорує ліву половину простору: їсть лише з правої половини тарілки.", "Prawy płat ciemieniowy": "Права тім'яна частка", "Płat ciemieniowy kieruje uwagą w przestrzeni. Po udarze prawego płata chory nie zauważa lewej strony świata: je z połowy talerza, rysuje pół zegara. To zaniedbywanie jednostronne (neglect), a oczy są zdrowe.": "Тім'яна частка керує увагою в просторі. Після інсульту правої частки хворий не помічає лівої половини світу: їсть з половини тарілки, малює пів годинника. Це одностороннє ігнорування (неглект), а очі здорові.", "Widzi twarze bliskich wyraźnie, ale ich nie rozpoznaje.": "Чітко бачить обличчя близьких, але не впізнає їх.", "Zakręt wrzecionowaty": "Веретеноподібна звивина", "Zakręt wrzecionowaty to fałd kory na spodzie płata skroniowego, wyspecjalizowany w twarzach. Uszkodzenie daje prozopagnozję, czyli „ślepotę na twarze”: chory rozpoznaje bliskich dopiero po głosie.": "Веретеноподібна звивина — складка кори на нижній поверхні скроневої частки, спеціалізована на обличчях. Ураження дає прозопагнозію, тобто «сліпоту на обличчя»: хворий упізнає близьких лише за голосом.", "Chwiejny chód, niezgrabne ruchy, drżenie przy sięganiu po kubek.": "Хитка хода, незграбні рухи, тремтіння, коли тягнеться по чашку.", "Uszkodzony móżdżek nie poprawia ruchu w trakcie: chód jest chwiejny jak po alkoholu, a ręka drży, gdy zbliża się do celu. To ataksja móżdżkowa.": "Уражений мозочок не виправляє рух під час виконання: хода хитка, як після алкоголю, а рука тремтить, наближаючись до мети. Це мозочкова атаксія.", "Wzgórze": "Таламус", "Wzgórze to stacja przekaźnikowa w środku mózgu, która przesyła do kory informacje ze zmysłów. Żaden z opisanych objawów nie wynika z jego uszkodzenia.": "Таламус — передавальна станція в центрі мозку, яка пересилає до кори інформацію від органів чуття. Жоден з описаних симптомів не випливає з його ураження.", "Neuron i synapsa": "Нейрон і синапс", "Budowa neuronu": "Будова нейрона", "Nazwij części neuronu ruchowego oznaczone numerami.": "Назви позначені номерами частини рухового нейрона.", "Dendryty": "Дендрити", "Rozgałęzione wypustki, które jak anteny odbierają sygnały od innych neuronów. Na nich są kolce dendrytyczne, małe wypustki, w których leżą synapsy.": "Розгалужені відростки, які, мов антени, приймають сигнали від інших нейронів. На них є дендритні шипики — маленькі вирости, де розташовані синапси.", "Ciało komórki (soma)": "Тіло клітини (сома)", "Jądro komórkowe": "Ядро клітини", "Przechowuje DNA i steruje syntezą białek.": "Зберігає ДНК і керує синтезом білків.", "Wzgórek aksonu": "Аксонний горбик", "Miejsce, w którym akson odchodzi od ciała komórki. Jest tu najwięcej kanałów sodowych, więc to tu zapada decyzja, czy wysłać impuls.": "Місце, де аксон відходить від тіла клітини. Тут найбільше натрієвих каналів, тож саме тут вирішується, чи надіслати імпульс.", "Osłonka mielinowa": "Мієлінова оболонка", "Przewężenie Ranviera": "Перехоплення Ранв'є", "Krótka przerwa w mielinie. Impuls przeskakuje od przewężenia do przewężenia (przewodzenie skokowe), dlatego biegnie dużo szybciej.": "Короткий проміжок без мієліну. Імпульс перестрибує від перехоплення до перехоплення (сальтаторне проведення), тому біжить набагато швидше.", "Zakończenia presynaptyczne": "Пресинаптичні закінчення", "Kolbki na końcach aksonu. W środku są pęcherzyki z neuroprzekaźnikiem, który wypuszczają do synapsy.": "Потовщення на кінцях аксона. Усередині — пухирці з нейромедіатором, який вони випускають у синапс.", "Astrocyt": "Астроцит", "Komórka glejowa regulująca środowisko neuronów i przepływ krwi. Nie tworzy mieliny.": "Гліальна клітина, що регулює середовище нейронів і кровотік. Мієліну не утворює.", "Potencjał czynnościowy": "Потенціал дії", "Ułóż etapy powstawania potencjału czynnościowego w kolejności.": "Розстав етапи виникнення потенціалу дії по порядку.", "Spoczynek: ok. −70 mV, wnętrze ujemne": "Спокій: ~−70 мВ, усередині негативно", "W spoczynku wnętrze neuronu ma ok. −70 mV względem otoczenia. Utrzymuje to pompa sodowo-potasowa: wyrzuca 3 jony Na⁺ i wciąga 2 jony K⁺.": "У спокої внутрішня частина нейрона має ~−70 мВ відносно середовища. Це підтримує натрій-калієвий насос: викидає 3 іони Na⁺ і закачує 2 іони K⁺.", "Depolaryzacja do progu (ok. −55 mV)": "Деполяризація до порогу (~−55 мВ)", "Depolaryzacja: wnętrze staje się mniej ujemne. Gdy pobudzenia z dendrytów zsumują się do progu (ok. −55 mV) na wzgórku aksonu, startuje impuls.": "Деполяризація: внутрішнє середовище стає менш негативним. Коли збудження з дендритів підсумуються до порогу (~−55 мВ) на аксонному горбику, стартує імпульс.", "Otwarcie kanałów Na⁺, Na⁺ wpływa": "Відкриття каналів Na⁺, Na⁺ входить", "Kanały bramkowane napięciem otwierają się, gdy zmienia się napięcie błony. Na⁺ wpada do środka i otwiera kolejne kanały. Dlatego impuls jest „wszystko albo nic”: albo pełny, albo żaden.": "Потенціалзалежні канали відкриваються, коли змінюється напруга мембрани. Na⁺ входить усередину і відкриває наступні канали. Тому імпульс підкоряється закону «все або нічого»: або повний, або жодного.", "Szczyt ok. +30 mV, inaktywacja kanałów Na⁺": "Пік ~+30 мВ, інактивація каналів Na⁺", "Wnętrze staje się dodatnie (ok. +30 mV). Kanały Na⁺ zamykają się na zatrzask (inaktywacja) i przez chwilę nie da się ich otworzyć: to bezwzględny okres refrakcji.": "Усередині стає позитивно (~+30 мВ). Канали Na⁺ замикаються «на засув» (інактивація) і якийсь час їх не можна відкрити: це абсолютний рефрактерний період.", "Kanały K⁺ otwarte, K⁺ wypływa: repolaryzacja": "Канали K⁺ відкриті, K⁺ виходить: реполяризація", "Kanały potasowe otwierają się później niż sodowe. K⁺ wypływa na zewnątrz, więc wnętrze znów staje się ujemne: to repolaryzacja.": "Калієві канали відкриваються пізніше, ніж натрієві. K⁺ виходить назовні, тож усередині знову стає негативно: це реполяризація.", "Hiperpolaryzacja następcza": "Слідова гіперполяризація", "Kanały K⁺ zamykają się z opóźnieniem, więc napięcie spada na chwilę poniżej spoczynkowego (ok. −80 mV). W tym czasie (względny okres refrakcji) potrzeba silniejszego bodźca.": "Канали K⁺ закриваються із запізненням, тож напруга на мить падає нижче рівня спокою (~−80 мВ). У цей час (відносний рефрактерний період) потрібен сильніший подразник.", "Powrót do spoczynku, impuls biegnie dalej": "Повернення до спокою, імпульс біжить далі", "Napięcie wraca do −70 mV. Impuls biegnie dalej wzdłuż aksonu, ale nie zawraca, bo odcinek za nim jest jeszcze w refrakcji.": "Напруга повертається до −70 мВ. Імпульс біжить далі вздовж аксона, але не повертає назад, бо ділянка за ним ще в рефрактерності.", "Przekaźnictwo synaptyczne": "Синаптична передача", "Ułóż zdarzenia w synapsie chemicznej we właściwej kolejności.": "Розстав події в хімічному синапсі в правильному порядку.", "Impuls dociera do zakończenia presynaptycznego": "Імпульс досягає пресинаптичного закінчення", "Potencjał czynnościowy dobiega aksonem do kolbki synaptycznej. Neuroprzekaźnik czeka tam już spakowany w pęcherzykach.": "Потенціал дії добігає аксоном до синаптичної бляшки. Нейромедіатор уже чекає там, запакований у пухирці.", "Kanały Ca²⁺ otwierają się, wapń wpływa": "Канали Ca²⁺ відкриваються, кальцій входить", "Zmiana napięcia otwiera kanały wapniowe. Wpływający Ca²⁺ to sygnał: wypuść przekaźnik.": "Зміна напруги відкриває кальцієві канали. Ca²⁺, що входить, — це сигнал: випусти медіатор.", "Pęcherzyki zlewają się z błoną (egzocytoza)": "Пухирці зливаються з мембраною (екзоцитоз)", "Egzocytoza: pęcherzyk zlewa się z błoną komórki i wylewa zawartość na zewnątrz, do szczeliny.": "Екзоцитоз: пухирець зливається з мембраною клітини й виливає вміст назовні, у щілину.", "Przekaźnik dyfunduje przez szczelinę": "Медіатор дифундує через щілину", "Szczelina synaptyczna to wąska przerwa (ok. 20–40 nm) między neuronami. Przekaźnik pokonuje ją w ułamku milisekundy.": "Синаптична щілина — вузький проміжок (~20–40 нм) між нейронами. Медіатор долає її за частку мілісекунди.", "Przekaźnik wiąże się z receptorami postsynaptycznymi": "Медіатор зв'язується з постсинаптичними рецепторами", "Powstaje EPSP lub IPSP": "Виникає ЗПСП або ГПСП", "EPSP (pobudzający potencjał postsynaptyczny) przybliża neuron do progu, IPSP (hamujący) go oddala. Neuron sumuje je wszystkie.": "ЗПСП (збуджувальний постсинаптичний потенціал, EPSP) наближає нейрон до порогу, ГПСП (гальмівний, IPSP) віддаляє. Нейрон підсумовує їх усі.", "Wychwyt zwrotny lub rozkład enzymatyczny": "Зворотне захоплення або ферментне розщеплення", "Sprzątanie szczeliny: transportery wciągają przekaźnik z powrotem do neuronu (wychwyt zwrotny) albo enzym go rozkłada, np. acetylocholinoesteraza rozkłada acetylocholinę.": "Прибирання щілини: транспортери затягують медіатор назад у нейрон (зворотне захоплення) або фермент його розщеплює, напр. ацетилхолінестераза розщеплює ацетилхолін.", "Neuroprzekaźniki i psychofarmakologia": "Нейромедіатори і психофармакологія", "Neuroprzekaźniki i zaburzenia": "Нейромедіатори і розлади", "Dopasuj neuroprzekaźnik do opisu jego roli.": "Зістав нейромедіатор з описом його ролі.", "Glutaminian": "Глутамат", "Najczęstszy przekaźnik pobudzający. Bierze udział w LTP, czyli wzmacnianiu synaps przy uczeniu. Gdy jest go za dużo (np. po udarze), zamęcza neurony na śmierć: to ekscytotoksyczność.": "Найпоширеніший збуджувальний медіатор. Бере участь у LTP, тобто посиленні синапсів під час навчання. Коли його забагато (напр. після інсульту), він «заганяє» нейрони до смерті: це ексайтотоксичність.", "GABA": "ГАМК", "Główny hamulec mózgu: otwiera kanały dla jonów Cl⁻, co oddala neuron od progu. Leki uspokajające (benzodiazepiny) i alkohol wzmacniają jego działanie.": "Головне гальмо мозку: відкриває канали для іонів Cl⁻, що віддаляє нейрон від порогу. Заспокійливі ліки (бензодіазепіни) й алкоголь посилюють його дію.", "Dopamina": "Дофамін", "Przekaźnik nagrody, motywacji i ruchu. Nadmiar w drodze mezolimbicznej (ze śródmózgowia do układu nagrody) wiąże się z objawami pozytywnymi schizofrenii, czyli urojeniami i omamami. Niedobór w prążkowiu daje chorobę Parkinsona.": "Медіатор винагороди, мотивації та руху. Надлишок у мезолімбічному шляху (від середнього мозку до системи винагороди) пов'язаний із позитивними симптомами шизофренії, тобто маренням і галюцинаціями. Нестача в смугастому тілі дає хворобу Паркінсона.", "Serotonina": "Серотонін", "Wpływa na nastrój, sen, apetyt i kontrolę impulsów. Leki SSRI na depresję zwiększają jej ilość w synapsie.": "Впливає на настрій, сон, апетит і контроль імпульсів. Антидепресанти СІЗЗС збільшують його кількість у синапсі.", "Acetylocholina": "Ацетилхолін", "Przekazuje polecenie z nerwu do mięśnia (złącze nerwowo-mięśniowe). W mózgu wspiera uwagę i pamięć. W chorobie Alzheimera giną neurony jądra podstawnego Meynerta, główne źródło acetylocholiny dla kory.": "Передає команду з нерва на м'яз (нервово-м'язовий синапс). У мозку підтримує увагу й пам'ять. При хворобі Альцгеймера гинуть нейрони базального ядра Мейнерта, головного джерела ацетилхоліну для кори.", "Noradrenalina": "Норадреналін", "Podnosi czujność i gotowość do działania. Wytwarza ją głównie miejsce sinawe (locus coeruleus), małe niebieskawe jądro w pniu mózgu.": "Підвищує пильність і готовність до дії. Виробляє його головно блакитна пляма (locus coeruleus) — маленьке синювате ядро у стовбурі мозку.", "Endogenne opioidy: łagodzą ból i stres.": "Ендогенні опіоїди: послаблюють біль і стрес.", "Endorfiny": "Ендорфіни", "Endogenne znaczy wytwarzane przez sam organizm. Endorfiny to naturalne opioidy: działają na te same receptory co morfina i tłumią ból, np. przy dużym wysiłku.": "Ендогенні означає «вироблені самим організмом». Ендорфіни — природні опіоїди: діють на ті самі рецептори, що й морфін, і приглушують біль, напр. під час великого фізичного навантаження.", "Kortyzol": "Кортизол", "To hormon kory nadnerczy, a nie neuroprzekaźnik.": "Це гормон кори надниркових залоз, а не нейромедіатор.", "Psychofarmakologia": "Психофармакологія", "Dopasuj substancję do mechanizmu działania.": "Зістав речовину з механізмом дії.", "Fluoksetyna (SSRI)": "Флуоксетин (СІЗЗС)", "SSRI to selektywny inhibitor wychwytu zwrotnego serotoniny: blokuje „odkurzacz”, więc serotoniny zostaje więcej w szczelinie. Nastrój poprawia się dopiero po kilku tygodniach.": "СІЗЗС — селективний інгібітор зворотного захоплення серотоніну: блокує «пилосос», тож серотоніну більше залишається в щілині. Настрій покращується лише через кілька тижнів.", "Diazepam (benzodiazepina)": "Діазепам (бензодіазепін)", "Przyczepia się do receptora GABA-A i wzmacnia hamujące działanie GABA: uspokaja, usypia, rozluźnia mięśnie. Grozi uzależnieniem, a z alkoholem może zatrzymać oddech.": "Приєднується до рецептора ГАМК-А і посилює гальмівну дію ГАМК: заспокоює, присипляє, розслаблює м'язи. Загрожує залежністю, а з алкоголем може зупинити дихання.", "Haloperidol": "Галоперидол", "Antagonista zajmuje receptor, ale go nie pobudza. Haloperidol blokuje receptory dopaminowe D2 i łagodzi urojenia i omamy. Skutek uboczny: sztywność i drżenie jak w Parkinsonie (objawy pozapiramidowe).": "Антагоніст займає рецептор, але не збуджує його. Галоперидол блокує дофамінові рецептори D2 і послаблює марення й галюцинації. Побічна дія: ригідність і тремор, як при Паркінсоні (екстрапірамідні симптоми).", "Prekursor dopaminy przechodzący przez barierę krew–mózg.": "Попередник дофаміну, що проходить через гематоенцефалічний бар'єр.", "L-DOPA": "L-ДОФА", "Dopamina z tabletki nie przejdzie z krwi do mózgu, bo zatrzyma ją bariera krew–mózg. L-DOPA przechodzi i dopiero w mózgu zamienia się w dopaminę. Tak leczy się Parkinsona.": "Дофамін із таблетки не потрапить із крові в мозок, бо його затримає гематоенцефалічний бар'єр. L-ДОФА проходить і лише в мозку перетворюється на дофамін. Так лікують Паркінсона.", "Hamuje acetylocholinoesterazę, wydłużając działanie ACh.": "Гальмує ацетилхолінестеразу, подовжуючи дію ACh.", "Donepezil": "Донепезил", "Acetylocholinoesteraza to enzym, który rozkłada acetylocholinę. Donepezil go hamuje, więc acetylocholiny jest więcej, co nieco poprawia pamięć w chorobie Alzheimera.": "Ацетилхолінестераза — фермент, який розщеплює ацетилхолін. Донепезил його гальмує, тож ацетилхоліну більше, що трохи покращує пам'ять при хворобі Альцгеймера.", "Blokuje transportery wychwytu zwrotnego dopaminy (oraz NA i 5-HT).": "Блокує транспортери зворотного захоплення дофаміну (а також NA і 5-HT).", "Kokaina": "Кокаїн", "Transporter to białko, które wciąga przekaźnik z powrotem do neuronu. Kokaina je blokuje, więc dopamina dłużej pobudza receptory: euforia.": "Транспортер — білок, що затягує медіатор назад у нейрон. Кокаїн їх блокує, тож дофамін довше збуджує рецептори: ейфорія.", "Odwraca działanie transporterów i zwiększa uwalnianie dopaminy.": "Обертає роботу транспортерів і збільшує вивільнення дофаміну.", "Amfetamina": "Амфетамін", "Odwraca transportery: zamiast wciągać dopaminę, wypychają ją z neuronu, nawet bez impulsu.": "Обертає транспортери: замість затягувати дофамін вони виштовхують його з нейрона, навіть без імпульсу.", "Nalokson": "Налоксон", "Antagonista receptorów opioidowych: wypiera heroinę czy morfinę z receptora. Przy przedawkowaniu przywraca oddech w kilka minut.": "Антагоніст опіоїдних рецепторів: витісняє героїн чи морфін з рецептора. При передозуванні відновлює дихання за кілька хвилин.", "Lit": "Літій", "Hormony, stres i emocje": "Гормони, стрес і емоції", "Oś stresu HPA": "Вісь стресу HPA", "Zbuduj oś podwzgórze–przysadka–nadnercza. Uwaga: dwie karty nie pasują.": "Збудуй вісь гіпоталамус–гіпофіз–надниркові залози. Увага: дві картки зайві.", "Struktura mózgu, która uruchamia odpowiedź na stresor": "Структура мозку, яка запускає відповідь на стресор", "Podwzgórze": "Гіпоталамус", "Podwzgórze to małe centrum sterowania tuż pod wzgórzem, które łączy mózg z hormonami. Na stres reaguje jego jądro przykomorowe.": "Гіпоталамус — маленький центр керування одразу під таламусом, який пов'язує мозок із гормонами. На стрес реагує його паравентрикулярне ядро.", "Hormon, który wydziela": "Гормон, який він виділяє", "CRH (kortykoliberyna)": "КРГ (кортиколіберин)", "CRH płynie krótkimi naczyniami krwionośnymi do przysadki i każe jej działać.": "КРГ тече короткими кровоносними судинами до гіпофіза і змушує його діяти.", "Gruczoł, który odbiera ten sygnał": "Залоза, яка приймає цей сигнал", "Przysadka (płat przedni)": "Гіпофіз (передня частка)", "Przysadka to gruczoł wielkości ziarnka grochu pod mózgiem, który steruje innymi gruczołami. Na CRH odpowiada jej przedni płat.": "Гіпофіз — залоза завбільшки з горошину під мозком, яка керує іншими залозами. На КРГ відповідає його передня частка.", "Hormon wydzielany przez ten gruczoł": "Гормон, який виділяє ця залоза", "ACTH": "АКТГ", "ACTH (hormon adrenokortykotropowy) płynie z krwią z przysadki do nadnerczy.": "АКТГ (адренокортикотропний гормон) тече з кров'ю від гіпофіза до надниркових залоз.", "Gruczoł docelowy": "Цільова залоза", "Kora nadnerczy": "Кора надниркових залоз", "Nadnercza to gruczoły leżące na nerkach. Ich zewnętrzna warstwa (kora) wydziela kortyzol, a środek (rdzeń) adrenalinę.": "Надниркові залози лежать на нирках. Їхній зовнішній шар (кора) виділяє кортизол, а середина (мозкова речовина) — адреналін.", "Kortyzol podnosi cukier we krwi i tłumi stan zapalny. Działa też wstecz: hamuje podwzgórze i przysadkę, żeby wyłączyć alarm (ujemne sprzężenie zwrotne). Długo podwyższony szkodzi hipokampowi.": "Кортизол підвищує цукор у крові й пригнічує запалення. Діє і назад: гальмує гіпоталамус і гіпофіз, щоб вимкнути тривогу (негативний зворотний зв'язок). Тривало підвищений шкодить гіпокампу.", "Adrenalina": "Адреналін", "Należy do szybkiej osi współczulno-nadnerczowej (SAM), wydziela ją rdzeń nadnerczy.": "Належить до швидкої симпато-адреналової осі (SAM), його виділяє мозкова речовина надниркових залоз.", "TSH": "ТТГ", "Hormon tyreotropowy steruje tarczycą, nie nadnerczami.": "Тиреотропний гормон керує щитоподібною залозою, а не наднирковими.", "Hormony a zachowanie": "Гормони і поведінка", "Dopasuj hormon do jego wpływu na zachowanie.": "Зістав гормон з його впливом на поведінку.", "Więź matka–dziecko, zaufanie, skurcze porodowe, wypływ mleka.": "Зв'язок мати–дитина, довіра, пологові скорочення, виділення молока.", "Oksytocyna": "Окситоцин", "Powstaje w podwzgórzu, a uwalnia ją tylny płat przysadki. Wywołuje skurcze porodowe i wypływ mleka, wzmacnia więź i zaufanie.": "Утворюється в гіпоталамусі, а вивільняє його задня частка гіпофіза. Викликає пологові скорочення і виділення молока, зміцнює прив'язаність і довіру.", "Melatonina": "Мелатонін", "Szyszynka, mały gruczoł w środku mózgu, wydziela ją, gdy jest ciemno. To sygnał: noc, pora spać.": "Епіфіз (шишкоподібна залоза), маленька залоза в центрі мозку, виділяє його, коли темно. Це сигнал: ніч, час спати.", "Testosteron": "Тестостерон", "Hormon płciowy męski (występuje też u kobiet). Przed narodzinami trwale kształtuje mózg (efekt organizacyjny), a w dorosłości nasila dominację i agresję (efekt aktywacyjny).": "Чоловічий статевий гормон (є і в жінок). До народження назавжди формує мозок (організаційний ефект), а в дорослості посилює домінантність і агресію (активаційний ефект).", "Wazopresyna": "Вазопресин", "Tyroksyna": "Тироксин", "Hormon tarczycy, przyspiesza przemianę materii. Jest niezbędny do rozwoju mózgu: jego brak u dziecka daje niepełnosprawność intelektualną (kretynizm), dlatego bada się każdego noworodka.": "Гормон щитоподібної залози, прискорює обмін речовин. Необхідний для розвитку мозку: його нестача в дитини дає інтелектуальну недостатність (кретинізм), тому обстежують кожного новонародженого.", "Grelina": "Грелін", "Hormon głodu z pustego żołądka. Pobudza ośrodek głodu w podwzgórzu (jądro łukowate).": "Гормон голоду з порожнього шлунка. Збуджує центр голоду в гіпоталамусі (аркуатне ядро).", "Leptyna": "Лептин", "Wydzielają ją komórki tłuszczowe: im więcej tłuszczu, tym więcej leptyny i mniejszy apetyt. Myszy bez leptyny jedzą bez końca.": "Його виділяють жирові клітини: що більше жиру, то більше лептину і менший апетит. Миші без лептину їдять без кінця.", "Insulina": "Інсулін", "Strach według LeDoux": "Страх за ЛеДу", "Widzisz coś wężowatego na ścieżce. Ułóż obwód strachu.": "Ти бачиш щось схоже на змію на стежці. Збудуй контур страху.", "Pierwsza stacja przekaźnikowa bodźca wzrokowego": "Перша передавальна станція зорового подразника", "Wzgórze przekazuje sygnały ze zmysłów dalej. Tu informacja się rozdziela: krótką drogą do ciała migdałowatego i długą do kory.": "Таламус передає сигнали від органів чуття далі. Тут інформація розділяється: коротким шляхом до мигдалеподібного тіла і довгим до кори.", "Droga niska: szybka, zgrubna ocena zagrożenia trafia bezpośrednio do…": "Низький шлях: швидка, груба оцінка загрози йде безпосередньо до…", "Droga niska to skrót wzgórze → ciało migdałowate. Obraz jest zgrubny, ale alarm włącza się w ułamku sekundy, zanim wiesz, co widzisz.": "Низький шлях — це скорочення таламус → мигдалеподібне тіло. Образ грубий, але тривога вмикається за частку секунди, ще до того, як ти зрозумієш, що бачиш.", "Droga wysoka: dokładna analiza (wąż czy patyk?)": "Високий шлях: точний аналіз (змія чи палиця?)", "Kora czuciowa": "Сенсорна кора", "Droga wysoka biegnie przez korę. Trwa dłużej, ale daje dokładny obraz (wąż czy patyk?). Kora może potwierdzić albo odwołać alarm.": "Високий шлях іде через кору. Триває довше, але дає точний образ (змія чи палиця?). Кора може підтвердити або скасувати тривогу.", "Kontekst: czy w tym miejscu już coś mi groziło?": "Контекст: чи мені вже щось загрожувало в цьому місці?", "Hipokamp zapamiętuje miejsca i sytuacje. Dzięki niemu boimy się w miejscu, w którym kiedyś coś się stało (warunkowanie kontekstowe).": "Гіпокамп запам'ятовує місця й ситуації. Завдяки йому ми боїмося там, де колись щось сталося (контекстуальне обумовлення).", "Uruchamia reakcję hormonalną i autonomiczną": "Запускає гормональну й вегетативну реакцію", "Podwzgórze uruchamia ciało: oś stresu HPA (kortyzol) i układ współczulny (szybsze serce).": "Гіпоталамус запускає тіло: вісь стресу HPA (кортизол) і симпатичну систему (частіше серцебиття).", "Wywołuje zamieranie (freezing)": "Викликає завмирання (freezing)", "Istota szara okołowodociągowa": "Навколоводопровідна сіра речовина", "Istota szara okołowodociągowa (PAG) w śródmózgowiu włącza zachowania obronne, np. zamarcie w bezruchu (freezing).": "Навколоводопровідна сіра речовина (PAG) у середньому мозку вмикає оборонну поведінку, напр. завмирання на місці (freezing).", "Hamuje ciało migdałowate przy wygaszaniu strachu": "Гальмує мигдалеподібне тіло під час згасання страху", "Przyśrodkowa kora przedczołowa": "Медіальна префронтальна кора", "Przyśrodkowa kora przedczołowa hamuje ciało migdałowate, gdy uczymy się, że coś jest już bezpieczne (wygaszanie strachu). Na tym opiera się terapia ekspozycyjna: stopniowe, bezpieczne oswajanie lęku.": "Медіальна префронтальна кора гальмує мигдалеподібне тіло, коли ми вчимося, що щось уже безпечне (згасання страху). На цьому ґрунтується експозиційна терапія: поступове, безпечне звикання до страху.", "Nie należy do głównego obwodu strachu opisanego przez LeDoux.": "Не належить до головного контуру страху, описаного ЛеДу.", "Uczenie się, pamięć, plastyczność": "Навчання, пам'ять, пластичність", "Systemy pamięci": "Системи пам'яті", "Dopasuj rodzaj pamięci lub uczenia do struktury.": "Зістав вид пам'яті або навчання зі структурою.", "Konsolidacja nowych faktów i zdarzeń (pamięć deklaratywna)": "Консолідація нових фактів і подій (декларативна пам'ять)", "Nawyki i pamięć proceduralna (np. jazda na rowerze)": "Звички і процедурна пам'ять (напр. їзда на велосипеді)", "Prążkowie": "Смугасте тіло", "Pamięć proceduralna to umiejętności i nawyki: się ich nie opowiada, tylko wykonuje. Uczy jej prążkowie w jądrach podstawnych.": "Процедурна пам'ять — це вміння і звички: їх не розповідають, а виконують. Її навчає смугасте тіло в базальних гангліях.", "Warunkowanie klasyczne odruchu mrugania": "Класичне обумовлення мигального рефлексу", "Dźwięk, a tuż po nim dmuchnięcie w oko: po kilku razach mrugamy na sam dźwięk. Ten prosty wyuczony odruch zapisuje móżdżek.": "Звук, а одразу за ним подув в око: після кількох разів кліпаємо на сам звук. Цей простий вивчений рефлекс записує мозочок.", "Warunkowanie strachu i pamięć emocjonalna": "Обумовлення страху та емоційна пам'ять", "Ciało migdałowate zapamiętuje, co jest groźne. Dlatego silne emocje zostawiają mocne wspomnienia.": "Мигдалеподібне тіло запам'ятовує, що небезпечне. Тому сильні емоції залишають яскраві спогади.", "Pamięć robocza: utrzymanie informacji przez kilka sekund": "Робоча пам'ять: утримання інформації кілька секунд", "Grzbietowo-boczna kora przedczołowa": "Дорсолатеральна префронтальна кора", "Pamięć robocza to notatnik w głowie: trzymasz w niej np. numer telefonu przez kilka sekund. Robi to grzbietowo-boczna (górno-boczna) część kory przedczołowej.": "Робоча пам'ять — це блокнот у голові: тримаєш у ній, напр., номер телефону кілька секунд. Цим займається дорсолатеральна (верхньо-бічна) частина префронтальної кори.", "Wiedza semantyczna o znaczeniu pojęć": "Семантичні знання про значення понять", "Przedni płat skroniowy": "Передня скронева частка", "Wiedza semantyczna to znaczenia słów i pojęć, np. czym jest pies. Gdy przednie płaty skroniowe zanikają, chory traci znaczenia słów: to otępienie semantyczne.": "Семантичні знання — це значення слів і понять, напр. що таке собака. Коли передні скроневі частки атрофуються, хворий втрачає значення слів: це семантична деменція.", "Realizuje odruchy, ale nie przechowuje opisanych rodzajów pamięci.": "Здійснює рефлекси, але не зберігає описаних видів пам'яті.", "Długotrwałe wzmocnienie synaptyczne (LTP)": "Довготривала потенціація (LTP)", "Ułóż mechanizm LTP w hipokampie krok po kroku.": "Розстав механізм LTP у гіпокампі крок за кроком.", "Silna, szybka stymulacja: dużo glutaminianu": "Сильна, швидка стимуляція: багато глутамату", "LTP to długotrwałe wzmocnienie synapsy, komórkowy ślad uczenia. Zaczyna się od szybkiej serii impulsów (stymulacja tetaniczna) i dużej porcji glutaminianu.": "LTP — довготривале посилення синапсу, клітинний слід навчання. Починається зі швидкої серії імпульсів (тетанічна стимуляція) і великої порції глутамату.", "Receptory AMPA wpuszczają Na⁺, błona się depolaryzuje": "Рецептори AMPA впускають Na⁺, мембрана деполяризується", "Receptory AMPA to szybkie kanały: po związaniu glutaminianu wpuszczają Na⁺ i neuron się depolaryzuje.": "Рецептори AMPA — швидкі канали: після зв'язування глутамату впускають Na⁺, і нейрон деполяризується.", "Depolaryzacja usuwa Mg²⁺ z kanału NMDA": "Деполяризація видаляє Mg²⁺ з каналу NMDA", "Receptor NMDA jest zatkany jonem magnezu, który wypycha dopiero silna depolaryzacja. NMDA otwiera się więc tylko wtedy, gdy oba neurony są aktywne naraz.": "Рецептор NMDA закупорений іоном магнію, який виштовхує лише сильна деполяризація. Тож NMDA відкривається тільки тоді, коли обидва нейрони активні одночасно.", "Ca²⁺ wpływa przez receptor NMDA": "Ca²⁺ входить через рецептор NMDA", "Przez otwarty receptor NMDA wpływa wapń i to on uruchamia zmiany w synapsie.": "Через відкритий рецептор NMDA входить кальцій, і саме він запускає зміни в синапсі.", "Ca²⁺ aktywuje kinazy (m.in. CaMKII)": "Ca²⁺ активує кінази (зокрема CaMKII)", "Wapń włącza enzymy zwane kinazami (np. CaMKII), które zmieniają białka synapsy.": "Кальцій вмикає ферменти, які називають кіназами (напр. CaMKII); вони змінюють білки синапсу.", "Do błony trafiają nowe receptory AMPA": "У мембрану вбудовуються нові рецептори AMPA", "Kinazy powodują wbudowanie nowych receptorów AMPA. Później rosną też nowe kolce dendrytyczne.": "Кінази спричиняють вбудовування нових рецепторів AMPA. Пізніше ростуть і нові дендритні шипики.", "Ten sam bodziec daje silniejszą odpowiedź": "Той самий подразник дає сильнішу відповідь", "Więcej receptorów AMPA to silniejsza odpowiedź na ten sam sygnał: synapsa zapamiętała doświadczenie.": "Більше рецепторів AMPA — сильніша відповідь на той самий сигнал: синапс «запам'ятав» досвід.", "Neuroplastyczność w praktyce": "Нейропластичність на практиці", "Dopasuj przykład kliniczny lub eksperymentalny do zjawiska.": "Зістав клінічний або експериментальний приклад із явищем.", "Londyńscy taksówkarze mają powiększoną tylną część hipokampa.": "Лондонські таксисти мають збільшену задню частину гіпокампа.", "Plastyczność zależna od doświadczenia": "Пластичність, залежна від досвіду", "Neuroplastyczność to zdolność mózgu do zmiany pod wpływem doświadczenia. Londyńscy taksówkarze latami uczą się mapy miasta i mają większy tylny hipokamp, odpowiedzialny za pamięć przestrzenną (badania Maguire).": "Нейропластичність — здатність мозку змінюватися під впливом досвіду. Лондонські таксисти роками вчать мапу міста і мають більший задній гіпокамп, що відповідає за просторову пам'ять (дослідження Магуайр).", "Po amputacji ręki dotyk twarzy wywołuje czucie w fantomowej dłoni.": "Після ампутації руки дотик до обличчя викликає відчуття у фантомній долоні.", "Reorganizacja mapy somatosensorycznej": "Реорганізація соматосенсорної карти", "Na mapie czucia w korze obszar twarzy sąsiaduje z obszarem ręki. Po amputacji twarz zajmuje nieużywany obszar ręki, więc dotyk policzka czuje się w nieistniejącej dłoni (Ramachandran).": "На карті чутливості в корі ділянка обличчя межує з ділянкою руки. Після ампутації обличчя займає невикористану ділянку руки, тож дотик до щоки відчувається в неіснуючій долоні (Рамачандран).", "U osób niewidomych czytanie Braille'a aktywuje korę wzrokową.": "У незрячих читання шрифтом Брайля активує зорову кору.", "Plastyczność międzymodalna": "Кросмодальна пластичність", "Międzymodalna znaczy „między zmysłami”. Kora wzrokowa niewidomych nie stoi pusta, tylko przejmuje dotyk i słuch.": "Кросмодальна означає «між органами чуття». Зорова кора незрячих не простоює, а перебирає дотик і слух.", "Kocięta z zasłoniętym jednym okiem w pierwszych tygodniach życia trwale tracą nim widzenie.": "Кошенята із закритим одним оком у перші тижні життя назавжди втрачають ним зір.", "Okres krytyczny": "Критичний період", "Okres krytyczny to czas we wczesnym rozwoju, w którym mózg musi dostać bodźce, żeby prawidłowo się połączyć. Kocięta z zasłoniętym w tym czasie okiem nie odzyskały nim widzenia (Hubel i Wiesel).": "Критичний період — час раннього розвитку, коли мозок мусить отримати подразники, щоб правильно сформувати зв'язки. Кошенята з оком, закритим у цей час, так і не відновили ним зір (Г'юбел і Візел).", "Szczury w klatkach z zabawkami i towarzystwem mają grubszą korę i więcej rozgałęzień dendrytów.": "Щури в клітках з іграшками й товариством мають товстішу кору і більше розгалужень дендритів.", "Środowisko wzbogacone": "Збагачене середовище", "Szczury w klatkach z zabawkami i towarzystwem miały grubszą korę i bardziej rozgałęzione dendryty niż szczury w pustych klatkach (Rosenzweig).": "Щури в клітках з іграшками й товариством мали товстішу кору і більш розгалужені дендрити, ніж щури в порожніх клітках (Розенцвейг).", "Unieruchomienie zdrowej ręki zmusza pacjenta po udarze do używania niedowładnej.": "Знерухомлення здорової руки змушує пацієнта після інсульту користуватися ослабленою.", "Terapia wymuszonego ruchu": "Терапія вимушеного руху", "Terapia wymuszonego ruchu (CIMT): unieruchamia się zdrową rękę, żeby pacjent po udarze ćwiczył chorą. Mózg się przebudowuje i ręka odzyskuje sprawność.": "Терапія вимушеного руху (CIMT): здорову руку знерухомлюють, щоб пацієнт після інсульту тренував хвору. Мозок перебудовується, і рука відновлює вправність.", "Ekscytotoksyczność": "Ексайтотоксичність", "To mechanizm uszkodzenia neuronów przez nadmiar glutaminianu, a nie przykład plastyczności.": "Це механізм ушкодження нейронів надлишком глутамату, а не приклад пластичності.", "Rozwój, geny i ewolucja": "Розвиток, гени й еволюція", "Rozwój układu nerwowego": "Розвиток нервової системи", "Ułóż etapy rozwoju układu nerwowego chronologicznie.": "Розстав етапи розвитку нервової системи в хронологічному порядку.", "Zamknięcie cewy nerwowej (ok. 4. tydzień)": "Замикання нервової трубки (~4-й тиждень)", "Proliferacja komórek w strefie przykomorowej": "Проліферація клітин у шлуночковій зоні", "Proliferacja to namnażanie. Komórki macierzyste dzielą się przy komorach mózgu (strefa przykomorowa) i tworzą miliardy przyszłych neuronów.": "Проліферація — це розмноження. Стовбурові клітини діляться біля шлуночків мозку (шлуночкова зона) і утворюють мільярди майбутніх нейронів.", "Migracja wzdłuż gleju radialnego": "Міграція вздовж радіальної глії", "Młode neurony wędrują na swoje miejsce po komórkach glejowych jak po linach (glej radialny). Gdy migracja zawiedzie, kora jest gładka, bez fałdów (lissencefalia).": "Молоді нейрони мандрують на своє місце по гліальних клітинах, як по канатах (радіальна глія). Коли міграція не вдається, кора гладенька, без звивин (лісенцефалія).", "Różnicowanie: wzrost aksonów i dendrytów": "Диференціація: ріст аксонів і дендритів", "Różnicowanie: neuron „decyduje”, jakim neuronem będzie, i wypuszcza akson oraz dendryty.": "Диференціація: нейрон «вирішує», яким нейроном буде, і випускає аксон і дендрити.", "Synaptogeneza": "Синаптогенез", "Synaptogeneza to tworzenie synaps. Najwięcej powstaje w pierwszych latach życia.": "Синаптогенез — утворення синапсів. Найбільше їх виникає в перші роки життя.", "Apoptoza i przycinanie synaps": "Апоптоз і обрізання синапсів", "Zbędne neurony obumierają w zaplanowany sposób (apoptoza), a nieużywane synapsy są usuwane. Przeżywają neurony, które dostają czynniki wzrostu (neurotrofiny). Alkohol w ciąży nasila obumieranie (FAS, płodowy zespół alkoholowy).": "Зайві нейрони відмирають запланованим способом (апоптоз), а невикористані синапси видаляються. Виживають нейрони, які отримують фактори росту (нейротрофіни). Алкоголь під час вагітності посилює відмирання (ФАС, фетальний алкогольний синдром).", "Koniec mielinizacji kory przedczołowej (ok. 20–25 r.ż.)": "Завершення мієлінізації префронтальної кори (~20–25 років)", "Mielinizacja zaczyna się przed narodzeniem, ale w korze przedczołowej kończy się najpóźniej, ok. 20–25 r.ż. Stąd młodzi ludzie słabiej hamują impulsy.": "Мієлінізація починається ще до народження, але в префронтальній корі завершується найпізніше, ~у 20–25 років. Тому молоді люди слабше гальмують імпульси.", "Genetyka zachowania": "Генетика поведінки", "Dopasuj pojęcie do definicji lub przykładu.": "Зістав поняття з визначенням або прикладом.", "Zestaw genów danego osobnika": "Набір генів конкретної особини", "Genotyp": "Генотип", "Genotyp to zestaw genów, który dostajesz od rodziców.": "Генотип — набір генів, які ти отримуєш від батьків.", "Obserwowalne cechy, w tym zachowanie, zależne od genów i środowiska": "Спостережувані ознаки, зокрема поведінка, що залежать від генів і середовища", "Fenotyp": "Фенотип", "Fenotyp to to, co widać: wygląd, zdolności, zachowanie. Zależy od genów i środowiska.": "Фенотип — те, що видно: зовнішність, здібності, поведінка. Залежить від генів і середовища.", "Odsetek zmienności cechy w danej populacji przypisywany różnicom genetycznym": "Частка мінливості ознаки в певній популяції, яку приписують генетичним відмінностям", "Odziedziczalność": "Успадковуваність", "Odziedziczalność (h²) mówi, jaka część różnic między ludźmi w danej grupie wynika z różnic w genach. Nic nie mówi o pojedynczej osobie i zmienia się, gdy zmienia się środowisko.": "Успадковуваність (h²) показує, яка частина відмінностей між людьми в певній групі зумовлена відмінностями в генах. Нічого не каже про окрему людину і змінюється, коли змінюється середовище.", "Bliźnięta mające niemal 100% wspólnych genów": "Близнюки, що мають майже 100% спільних генів", "Bliźnięta monozygotyczne": "Монозиготні близнюки", "Monozygotyczne (jednojajowe) powstają z jednej zapłodnionej komórki, więc mają prawie te same geny.": "Монозиготні (однояйцеві) розвиваються з однієї заплідненої клітини, тож мають майже однакові гени.", "Bliźnięta mające średnio 50% wspólnych genów": "Близнюки, що мають у середньому 50% спільних генів", "Bliźnięta dizygotyczne": "Дизиготні близнюки", "Dizygotyczne (dwujajowe) powstają z dwóch komórek i genetycznie są jak zwykłe rodzeństwo. Jeśli MZ są do siebie bardziej podobne niż DZ, cecha jest częściowo dziedziczna.": "Дизиготні (двояйцеві) розвиваються з двох клітин і генетично подібні до звичайних братів і сестер. Якщо МЗ схожіші між собою, ніж ДЗ, ознака частково спадкова.", "Zmiana ekspresji genów bez zmiany sekwencji DNA, np. przez metylację": "Зміна експресії генів без зміни послідовності ДНК, напр. через метилювання", "Epigenetyka": "Епігенетика", "Epigenetyka to włączniki genów. Metylacja to doczepienie do DNA małych grup chemicznych, które wyłączają gen. Np. szczury mało lizane przez matkę jako dorosłe gorzej znoszą stres.": "Епігенетика — це «вимикачі» генів. Метилювання — приєднання до ДНК маленьких хімічних груп, які вимикають ген. Напр., щури, яких мати мало вилизувала, у дорослому віці гірше переносять стрес.", "Wariant genu MAOA zwiększa ryzyko przemocy głównie u osób maltretowanych w dzieciństwie": "Варіант гена MAOA підвищує ризик насильства головно в людей, з якими погано поводилися в дитинстві", "Interakcja gen–środowisko": "Взаємодія ген–середовище", "Gen działa różnie zależnie od środowiska. Słabszy wariant genu MAOA (enzymu rozkładającego m.in. serotoninę) zwiększał ryzyko przemocy tylko u osób krzywdzonych w dzieciństwie (Caspi, 2002).": "Ген діє по-різному залежно від середовища. Слабший варіант гена MAOA (ферменту, що розщеплює, зокрема, серотонін) підвищував ризик насильства лише в людей, яких кривдили в дитинстві (Каспі, 2002).", "Choroba jednogenowa: dieta bez fenyloalaniny zapobiega niepełnosprawności intelektualnej": "Моногенна хвороба: дієта без фенілаланіну запобігає інтелектуальній недостатності", "Fenyloketonuria": "Фенілкетонурія", "Przez jeden wadliwy gen organizm nie rozkłada fenyloalaniny (składnika białek), która gromadzi się i uszkadza mózg. Dieta bez fenyloalaniny od urodzenia zapobiega szkodom: geny to nie wyrok.": "Через один дефектний ген організм не розщеплює фенілаланін (складник білків), який накопичується і шкодить мозку. Дієта без фенілаланіну від народження запобігає шкоді: гени — не вирок.", "Dryf genetyczny": "Генетичний дрейф", "Ewolucyjne podstawy zachowania": "Еволюційні основи поведінки", "Dopasuj mechanizm ewolucyjny do przykładu.": "Зістав еволюційний механізм із прикладом.", "Cechy zwiększające przeżycie i rozród stają się w populacji częstsze": "Ознаки, що збільшують виживання і розмноження, стають у популяції частішими", "Dobór naturalny": "Природний добір", "Osobniki z cechami, które pomagają przeżyć i mieć potomstwo, częściej przekazują swoje geny. Z pokolenia na pokolenie te cechy się upowszechniają (Darwin).": "Особини з ознаками, які допомагають вижити й мати потомство, частіше передають свої гени. З покоління в покоління ці ознаки поширюються (Дарвін).", "Pawi ogon: cecha kosztowna, ale zwiększająca szanse na partnera": "Хвіст павича: дорога ознака, але вона збільшує шанси на партнерку", "Dobór płciowy": "Статевий добір", "Cecha może się rozpowszechnić, bo pomaga zdobyć partnera, nawet jeśli utrudnia przeżycie. Pawi ogon przyciąga samice, choć przeszkadza w ucieczce.": "Ознака може поширитися, бо допомагає здобути партнера, навіть якщо заважає виживати. Хвіст павича приваблює самок, хоча заважає втікати.", "Pomaganie krewnym, z którymi dzielimy geny (reguła Hamiltona)": "Допомога родичам, з якими маємо спільні гени (правило Гамільтона)", "Dobór krewniaczy": "Родинний добір", "Pomagając krewnym, pomagasz genom, które z nimi dzielisz. Reguła Hamiltona: pomoc się opłaca, gdy r × B > C (r to pokrewieństwo, B korzyść krewnego, C twój koszt).": "Допомагаючи родичам, ти допомагаєш генам, які маєш спільні з ними. Правило Гамільтона: допомога вигідна, коли r × B > C (r — спорідненість, B — користь для родича, C — твої витрати).", "Pomagam ci teraz, bo liczę, że ty pomożesz mnie później": "Допомагаю тобі зараз, бо розраховую, що ти допоможеш мені пізніше", "Altruizm odwzajemniony": "Взаємний альтруїзм", "Pomaganie obcym na zasadzie „ty mnie, ja tobie” (Trivers). Działa u gatunków, które rozpoznają się nawzajem i pamiętają przysługi.": "Допомога чужим за принципом «ти мені, я тобі» (Трайверс). Працює у видів, які впізнають одне одного й пам'ятають послуги.", "Lęk przed wężami nabywamy łatwiej niż przed gniazdkami elektrycznymi": "Страх перед зміями ми набуваємо легше, ніж перед електричними розетками", "Przygotowanie biologiczne": "Біологічна готовність", "Przygotowanie biologiczne (preparedness, Seligman): ewolucja nastawiła nas na szybkie uczenie się lęku przed dawnymi zagrożeniami (węże, pająki), a nie przed nowymi (gniazdka).": "Біологічна готовність (preparedness, Селігман): еволюція налаштувала нас швидко вчитися боятися давніх загроз (змій, павуків), а не нових (розеток).", "Cecha ukształtowana przez dobór do pełnienia konkretnej funkcji": "Ознака, сформована добором для виконання певної функції", "Adaptacja": "Адаптація", "Adaptacja to cecha, którą dobór ukształtował, bo pełniła konkretną funkcję. Nie każda cecha nią jest: niektóre to produkty uboczne innych.": "Адаптація — ознака, яку сформував добір, бо вона виконувала певну функцію. Не кожна ознака є адаптацією: деякі — побічні продукти інших.", "Dziedziczenie cech nabytych": "Успадкування набутих ознак", "Pogląd Lamarcka, odrzucony przez współczesną biologię.": "Погляд Ламарка, відкинутий сучасною біологією.", "Metody badania mózgu": "Методи дослідження мозку", "Odczytaj zapis EEG": "Прочитай запис ЕЕГ", "Dopasuj wzorzec EEG do stanu lub zjawiska.": "Зістав патерн ЕЕГ зі станом або явищем.", "Fale delta, 0,5–4 Hz, duża amplituda": "Дельта-хвилі, 0,5–4 Гц, велика амплітуда", "Głęboki sen (N3)": "Глибокий сон (N3)", "EEG zapisuje elektryczną aktywność kory elektrodami na głowie. Fale delta są wolne (0,5–4 drgania na sekundę) i wysokie, bo w głębokim śnie N3 neurony pracują razem, w jednym rytmie.": "ЕЕГ записує електричну активність кори електродами на голові. Дельта-хвилі повільні (0,5–4 коливання за секунду) і високі, бо в глибокому сні N3 нейрони працюють разом, в одному ритмі.", "Fale theta, 4–8 Hz": "Тета-хвилі, 4–8 Гц", "Senność, faza N1": "Сонливість, фаза N1", "Fale theta (4–8 Hz) pojawiają się, gdy zasypiamy, czyli w fazie N1, najpłytszym śnie.": "Тета-хвилі (4–8 Гц) з'являються, коли ми засинаємо, тобто у фазі N1, найповерхневішому сні.", "Fale alfa, 8–13 Hz, najsilniejsze nad potylicą": "Альфа-хвилі, 8–13 Гц, найсильніші над потилицею", "Relaks z zamkniętymi oczami": "Розслаблення з заплющеними очима", "Fale alfa (8–13 Hz) to spokojny relaks z zamkniętymi oczami, najlepiej widoczny nad płatem potylicznym. Otwarcie oczu je wygasza.": "Альфа-хвилі (8–13 Гц) — це спокійне розслаблення із заплющеними очима, найкраще видно над потиличною часткою. Розплющення очей їх гасить.", "Fale beta, 13–30 Hz, niska amplituda": "Бета-хвилі, 13–30 Гц, низька амплітуда", "Czuwanie i skupienie": "Неспання і зосередженість", "Fale beta (13–30 Hz) są szybkie i niskie, bo przy czuwaniu i skupieniu neurony pracują niezależnie od siebie.": "Бета-хвилі (13–30 Гц) швидкі й низькі, бо під час неспання і зосередження нейрони працюють незалежно одне від одного.", "Wrzeciona snu i kompleksy K": "Сонні веретена і K-комплекси", "Faza N2": "Фаза N2", "Faza N2 ma znaki szczególne: wrzeciona snu (krótkie serie szybkich fal) i kompleksy K (pojedyncza, duża fala). Wrzeciona pomagają utrwalać pamięć.": "Фаза N2 має особливі ознаки: сонні веретена (короткі серії швидких хвиль) і K-комплекси (одна велика хвиля). Веретена допомагають закріплювати пам'ять.", "Zapis podobny do czuwania, szybkie ruchy gałek ocznych, atonia mięśni": "Запис схожий на неспання, швидкі рухи очей, атонія м'язів", "Sen REM": "Сон REM", "Napad nieświadomości": "Абсанс-напад", "Napad nieświadomości (absencja) to rodzaj padaczki, zwykle u dzieci: na kilka sekund dziecko „wyłącza się” i patrzy w pustkę. W EEG widać regularne iglice z falą, 3 razy na sekundę.": "Абсанс-напад (абсанс) — вид епілепсії, зазвичай у дітей: на кілька секунд дитина «вимикається» і дивиться в порожнечу. На ЕЕГ видно регулярні комплекси пік–хвиля, 3 рази на секунду.", "Potencjał wywołany ok. 300 ms po rzadkim, istotnym bodźcu": "Викликаний потенціал ~300 мс після рідкісного, важливого подразника", "Potencjał wywołany (ERP) to odpowiedź mózgu na bodziec, uśredniona z wielu prób. P300 to dodatnia fala ok. 300 ms po rzadkim, ważnym bodźcu: znak, że go zauważyliśmy.": "Викликаний потенціал (ERP) — відповідь мозку на подразник, усереднена з багатьох спроб. P300 — позитивна хвиля ~300 мс після рідкісного, важливого подразника: знак, що ми його помітили.", "Metody neuroobrazowania": "Методи нейровізуалізації", "Do czego służy dana metoda?": "Для чого слугує метод?", "Obraz struktury": "Зображення структури", "Pomiar aktywności": "Вимірювання активності", "Stymulacja mózgu": "Стимуляція мозку", "Tomografia komputerowa (CT)": "Комп'ютерна томографія (КТ)", "Rezonans magnetyczny (MRI)": "Магнітно-резонансна томографія (МРТ)", "Dokładny obraz anatomii bez promieniowania jonizującego.": "Точне зображення анатомії без іонізуючого випромінювання.", "Obrazowanie tensora dyfuzji (DTI)": "Дифузійно-тензорна візуалізація (DTI)", "Sprawdza, w którą stronę przesuwa się woda w tkance. Wzdłuż włókien nerwowych płynie łatwiej, więc widać przebieg szlaków istoty białej, czyli połączeń.": "Перевіряє, в який бік рухається вода в тканині. Уздовж нервових волокон вона тече легше, тож видно перебіг шляхів білої речовини, тобто зв'язків.", "EEG": "ЕЕГ", "Rozdzielczość czasowa rzędu milisekund, słaba przestrzenna.": "Часова роздільність — мілісекунди, просторова слабка.", "MEG": "МЕГ", "Mierzy pola magnetyczne wytwarzane przez prądy neuronalne.": "Вимірює магнітні поля, які створюють нейронні струми.", "fMRI (sygnał BOLD)": "фМРТ (сигнал BOLD)", "BOLD: aktywny obszar dostaje więcej utlenowanej krwi, a ta inaczej wpływa na pole magnetyczne. Dokładne w przestrzeni (milimetry), ale wolne (sekundy).": "BOLD: активна ділянка отримує більше насиченої киснем крові, а вона інакше впливає на магнітне поле. Точно в просторі (міліметри), але повільно (секунди).", "PET": "ПЕТ", "Do krwi podaje się substancję z radioaktywnym znacznikiem, a skaner pokazuje, gdzie się gromadzi, np. gdzie mózg zużywa najwięcej glukozy.": "У кров вводять речовину з радіоактивною міткою, а сканер показує, де вона накопичується, напр. де мозок споживає найбільше глюкози.", "Przezczaszkowa stymulacja magnetyczna (TMS)": "Транскраніальна магнітна стимуляція (ТМС)", "Cewka przy głowie wytwarza pole magnetyczne, które na chwilę zakłóca pracę kory pod nią. Tak sprawdza się, czy dany obszar jest potrzebny do zadania.": "Котушка біля голови створює магнітне поле, яке на мить порушує роботу кори під нею. Так перевіряють, чи ця ділянка потрібна для завдання.", "Głęboka stymulacja mózgu (DBS)": "Глибока стимуляція мозку (DBS)", "Wszczepione elektrody, np. w chorobie Parkinsona.": "Вживлені електроди, напр. при хворобі Паркінсона.", "Stymulacja prądem stałym (tDCS)": "Стимуляція постійним струмом (tDCS)", "Słaby prąd zmienia pobu
